<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1000 Mots Anglais — Vocabulaire & Prononciation</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f1923;
    color: #e8e6e3;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }
  html { height: -webkit-fill-available; overflow: hidden; }

  /* ── SCREENS ── */
  .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .screen.active { display: flex; align-items: center; justify-content: center; }

  /* ── GROUP SELECT ── */
  .group-select {
    flex-direction: column;
    padding: 1rem;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    align-items: center;
    justify-content: flex-start !important;
    padding-top: 2rem;
  }
  .group-select h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #8a9bb5;
    margin-bottom: 0.3rem;
    flex-shrink: 0;
  }
  .group-select .subtitle {
    font-size: 0.82rem;
    color: #4e5d73;
    margin-bottom: 1.2rem;
    flex-shrink: 0;
  }
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 420px;
    width: 100%;
    padding-bottom: 2rem;
    flex-shrink: 0;
  }
  .group-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 4px;
    font-size: 0.78rem;
    color: #7a8ea6;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    line-height: 1.3;
    touch-action: manipulation;
  }
  .group-btn:active { transform: scale(0.93); }
  .group-btn .gnum { font-size: 1.05rem; font-weight: 700; color: #b0c4de; display: block; }
  .group-btn .grange { font-size: 0.62rem; color: #4e5d73; display: block; margin-top: 2px; }
  .group-btn.completed { border-color: #2a6e4e; background: rgba(42,110,78,0.15); }
  .group-btn.completed .gnum { color: #5bbd8a; }
  .group-btn.in-progress { border-color: #5a5030; background: rgba(90,80,48,0.15); }
  .group-btn.in-progress .gnum { color: #d4b85a; }

  /* ── CARD SCREEN ── */
  .card-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    margin-bottom: 0.6rem;
  }
  .back-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #7a8ea6;
    font-size: 0.82rem;
    padding: 6px 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .back-btn:active { opacity: 0.6; }
  .group-label {
    font-size: 0.82rem;
    color: #4e5d73;
  }
  .progress-track {
    width: 100%;
    max-width: 440px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-bottom: 1.4rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3a8f6a, #5bbd8a);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0;
  }

  /* ── THE CARD ── */
  .card {
    width: 100%;
    max-width: 440px;
    min-height: 260px;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    margin-bottom: 1.2rem;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(ellipse at 30% 20%, rgba(90,160,230,0.06), transparent 60%);
    pointer-events: none;
  }
  .word-rank {
    font-size: 0.72rem;
    color: #3d4f66;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }
  .word-en {
    font-size: 2.8rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
    text-align: center;
    line-height: 1.15;
  }
  .word-ipa {
    font-size: 1.5rem;
    color: #6cb4ee;
    font-weight: 300;
    margin-bottom: 0.5rem;
    min-height: 2.2rem;
    text-align: center;
  }
  .word-fr {
    font-size: 1.15rem;
    color: #d4b85a;
    font-weight: 400;
    min-height: 1.6rem;
    text-align: center;
  }
  .word-class {
    font-size: 0.75rem;
    color: #4e5d73;
    font-style: italic;
    margin-top: 0.4rem;
    min-height: 1rem;
  }

  /* ── BUTTONS ── */
  .buttons-zone {
    height: 3.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.4rem;
    position: relative;
    width: 100%;
    max-width: 440px;
  }
  .buttons {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    position: absolute;
  }
  .buttons.hidden { visibility: hidden; pointer-events: none; }
  button {
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active:not(:disabled) { transform: scale(0.95); opacity: 0.85; }
  button:disabled { cursor: default; opacity: 0.35; }
  .btn-reveal {
    background: linear-gradient(135deg, #3a6fa0, #2a5080);
    color: white;
    min-width: 200px;
    box-shadow: 0 4px 20px rgba(42,80,128,0.4);
  }
  .btn-known {
    background: linear-gradient(135deg, #2a8a5a, #34a06a);
    color: white;
    box-shadow: 0 4px 15px rgba(42,138,90,0.3);
  }
  .btn-review {
    background: linear-gradient(135deg, #c07a30, #d4943a);
    color: white;
    box-shadow: 0 4px 15px rgba(192,122,48,0.3);
  }
  .btn-restart {
    background: linear-gradient(135deg, #3a6fa0, #2a5080);
    color: white;
    min-width: 200px;
  }

  .stats {
    font-size: 0.74rem;
    color: #3d4f66;
    line-height: 1.8;
    text-align: center;
  }
  .stats strong { color: #6a7f9a; }

  /* ── DONE ── */
  .done-box {
    text-align: center;
    padding: 2rem;
  }
  .done-box h2 {
    font-size: 1.8rem;
    font-weight: 300;
    color: #5bbd8a;
    margin-bottom: 1rem;
  }
  .done-box p {
    color: #5a6f88;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  @media (max-width: 370px) {
    .word-en { font-size: 2.2rem; }
    .word-ipa { font-size: 1.25rem; }
    .groups-grid { grid-template-columns: repeat(4, 1fr); }
    button { padding: 12px 18px; font-size: 0.88rem; }
  }
  @media (max-height: 650px) {
    .card { min-height: 200px; padding: 1.2rem; }
    .word-en { font-size: 2.2rem; }
  }
</style>
</head>

<!-- ═══ SCREEN 1: GROUP SELECT ═══ -->
<div class="screen group-select active" id="screenGroups">

["negative","ˈnɛɡətɪv","négatif","adj."],
["exercise","ˈɛksərsaɪz","exercice","n."],
["obviously","ˈɒbviəsli","évidemment","adv."],
["customer","ˈkʌstəmər","client","n."],
["wild","waɪld","sauvage","adj."],
["positive","ˈpɒzətɪv","positif","adj."],
["stuff","stʌf","truc","n."],
["prison","ˈprɪzən","prison","n."],
["forget","fərˈɡɛt","oublier","v."],
["release","rɪˈliːs","libérer ; sortie","v./n."],
["argue","ˈɑːrɡjuː","argumenter","v."],
["worth","wɜːrθ","valeur ; valant","n./adj."],
["crisis","ˈkraɪsɪs","crise","n."],
["decade","ˈdɛkeɪd","décennie","n."],
["absolutely","ˌæbsəˈluːtli","absolument","adv."]
];

// ═══════════════════════════════════
// APP STATE
// ═══════════════════════════════════
var GSIZE = 20;
var NGROUPS = Math.ceil(W.length / GSIZE);
var currentGroup = -1;
var groupWords = [];
var available = [];
var reviewQueue = [];
var known = [];
var turn = 0;
var current = null;
var revealed = false;

// Load progress from memory
var progress = {};
try {
  var saved = localStorage.getItem('eng1000_progress');
  if (saved) progress = JSON.parse(saved);
} catch(e) {}

function saveProgress() {
  try {
    progress[currentGroup] = { known: known.length, total: groupWords.length };
    localStorage.setItem('eng1000_progress', JSON.stringify(progress));
  } catch(e) {}
}

// ═══════════════════════════════════
// GROUP SELECT
// ═══════════════════════════════════
function buildGroupGrid() {
  var grid = document.getElementById('groupsGrid');
  grid.innerHTML = '';
  for (var g = 0; g < NGROUPS; g++) {
    var btn = document.createElement('div');
    btn.className = 'group-btn';
    var start = g * GSIZE + 1;
    var end = Math.min((g + 1) * GSIZE, W.length);
    var p = progress[g];
    if (p && p.known >= p.total) btn.className += ' completed';
    else if (p && p.known > 0) btn.className += ' in-progress';
    btn.innerHTML = '<span class="gnum">' + (g + 1) + '</span><span class="grange">' + start + '–' + end + '</span>';
    btn.setAttribute('data-g', g);
    (function(gg) {
      btn.addEventListener('click', function() { startGroup(gg); });
      btn.addEventListener('touchstart', function(e) { e.preventDefault(); startGroup(gg); }, {passive:false});
    })(g);
    grid.appendChild(btn);
  }
}

function startGroup(g) {
  currentGroup = g;
  var start = g * GSIZE;
  var end = Math.min(start + GSIZE, W.length);
  groupWords = [];
  for (var i = start; i < end; i++) {
    groupWords.push({ idx: i, word: W[i][0], ipa: W[i][1], fr: W[i][2], cls: W[i][3] });
  }
  available = groupWords.slice();
  reviewQueue = [];
  known = [];
  turn = 0;
  revealed = false;

  document.getElementById('groupLabel').textContent = 'Groupe ' + (g + 1) + ' · mots ' + (start + 1) + '–' + end;
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('theCard').style.display = '';
  document.querySelector('.buttons-zone').style.display = '';
  document.getElementById('stats').style.display = '';

  document.getElementById('screenGroups').classList.remove('active');
  document.getElementById('screenCard').classList.add('active');
  showWord();
}

function goBack() {
  saveProgress();
  document.getElementById('screenCard').classList.remove('active');
  document.getElementById('screenGroups').classList.add('active');
  buildGroupGrid();
}

// ═══════════════════════════════════
// FLASHCARD LOGIC
// ═══════════════════════════════════
function pickNext() {
  var i, pick;
  var due = [];
  for (i = 0; i < reviewQueue.length; i++) {
    if (reviewQueue[i].showAtTurn <= turn) due.push(reviewQueue[i]);
  }
  if (due.length > 0) {
    pick = due[Math.floor(Math.random() * due.length)];
    reviewQueue = reviewQueue.filter(function(r) { return r !== pick; });
    return pick.w;
  }
  if (available.length > 0) {
    return available[Math.floor(Math.random() * available.length)];
  }
  if (reviewQueue.length > 0) {
    reviewQueue.sort(function(a, b) { return a.showAtTurn - b.showAtTurn; });
    pick = reviewQueue[0];
    reviewQueue = reviewQueue.slice(1);
    return pick.w;
  }
  return null;
}

function showWord() {
  current = pickNext();
  if (!current) {
    document.getElementById('theCard').style.display = 'none';
    document.querySelector('.buttons-zone').style.display = 'none';
    document.getElementById('stats').style.display = 'none';
    document.getElementById('doneBox').style.display = 'block';
    document.getElementById('doneSummary').textContent =
      'Vous avez maîtrisé les ' + groupWords.length + ' mots de ce groupe !';
    saveProgress();
    return;
  }
  revealed = false;
  document.getElementById('wordRank').textContent = '#' + (current.idx + 1);
  document.getElementById('wordEn').textContent = current.word;
  document.getElementById('wordIpa').innerHTML = '&nbsp;';
  document.getElementById('wordFr').innerHTML = '&nbsp;';
  document.getElementById('wordClass').innerHTML = '&nbsp;';
  document.getElementById('revealBtn').disabled = false;
  document.getElementById('revealButtons').classList.remove('hidden');
  document.getElementById('actionButtons').classList.add('hidden');
  updateStats();
}

function doReveal() {
  if (!current || revealed) return;
  revealed = true;
  turn++;
  document.getElementById('wordIpa').textContent = '/' + current.ipa + '/';
  document.getElementById('wordFr').textContent = current.fr;
  document.getElementById('wordClass').textContent = current.cls;
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('revealButtons').classList.add('hidden');
  document.getElementById('actionButtons').classList.remove('hidden');
}

function doKnown() {
  if (!current) return;
  var w = current;
  available = available.filter(function(x) { return x !== w; });
  reviewQueue = reviewQueue.filter(function(x) { return x.w !== w; });
  known.push(w);
  saveProgress();
  showWord();
}

function doReview() {
  if (!current) return;
  var w = current;
  available = available.filter(function(x) { return x !== w; });
  reviewQueue = reviewQueue.filter(function(x) { return x.w !== w; });
  reviewQueue.push({ w: w, showAtTurn: turn + 3 });
  showWord();
}

function updateStats() {
  var pct = groupWords.length > 0 ? Math.round(known.length / groupWords.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stats').innerHTML =
    '✓ Connus\u00A0: <strong>' + known.length + '</strong> · ' +
    '↻ À revoir\u00A0: <strong>' + reviewQueue.length + '</strong> · ' +
    'Restants\u00A0: <strong>' + available.length + '</strong>';
}

function doRestart() {
  available = groupWords.slice();
  reviewQueue = [];
  known = [];
  turn = 0;
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('theCard').style.display = '';
  document.querySelector('.buttons-zone').style.display = '';
  document.getElementById('stats').style.display = '';
  showWord();
}

// ═══════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════
function tapHandler(id, fn) {
  var el = document.getElementById(id);
  if (!el) return;
  var touched = false;
  el.addEventListener('touchstart', function(e) {
    e.preventDefault(); e.stopPropagation(); touched = true; fn();
  }, { passive: false });
  el.addEventListener('touchend', function(e) {
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });
  el.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    if (!touched) fn();
    touched = false;
  });
}

tapHandler('revealBtn', doReveal);
tapHandler('knownBtn', doKnown);
tapHandler('reviewBtn', doReview);
tapHandler('restartBtn', doRestart);
tapHandler('backBtn', goBack);
tapHandler('backBtn2', goBack);

document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

// Keyboard support
document.addEventListener('keydown', function(e) {
  if (document.getElementById('screenCard').classList.contains('active')) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!revealed) doReveal();
    } else if (e.code === 'ArrowRight' || e.code === 'KeyK') {
      if (revealed) doKnown();
    } else if (e.code === 'ArrowLeft' || e.code === 'KeyR') {
      if (revealed) doReview();
    } else if (e.code === 'Escape') {
      goBack();
    }
  }
});

buildGroupGrid();
</script>
