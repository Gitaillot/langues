<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<title>Genre des noms</title>
<meta name="apple-mobile-web-app-title" content="Genre des noms">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  /* Même thème que Wortschatz B2-C1 : « Encre et papier », accents « Forêt » */
  :root {
    --bg: #15181d; --text: #e6e8eb; --strong: #ffffff; --title: #d9c88f;
    --soft: #a3abb5; --muted: #8a929c; --faint: #6b737d;
    --accent: #d9c88f; --accent-bg: rgba(217,200,143,0.10); --accent-bd: rgba(217,200,143,0.45);
    --line: #2e353e; --line-2: #252a31; --surface: #1f242b; --card: #1f242b;
    --input-bg: #111418; --modal-bg: #1f242b;
    --main: #d9c88f; --main-text: #15181d;
    --ok-text: #8fd08f; --ko-text: #f08080; --part-text: #e0c060;
    --der: #86b8f5; --die: #f08080; --das: #a6e3a0;
    --der-bg: rgba(134,184,245,0.12); --die-bg: rgba(240,128,128,0.12); --das-bg: rgba(166,227,160,0.12);
    --shadow: rgba(0,0,0,0.5); --overlay: rgba(10,12,15,0.75);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f3ef; --text: #1d2128; --strong: #11151b; --title: #2f5a45;
      --soft: #4b5563; --muted: #6b7280; --faint: #9097a1;
      --accent: #2f5a45; --accent-bg: rgba(47,90,69,0.08); --accent-bd: rgba(47,90,69,0.45);
      --line: #dcd9d2; --line-2: #e8e6e0; --surface: #ffffff; --card: #ffffff;
      --input-bg: #ffffff; --modal-bg: #ffffff;
      --main: #2f5a45; --main-text: #ffffff;
      --ok-text: #2f7d2f; --ko-text: #b42828; --part-text: #8f7a2e;
      --der: #1f5fb4; --die: #b42828; --das: #2f7d2f;
      --der-bg: rgba(31,95,180,0.08); --die-bg: rgba(180,40,40,0.08); --das-bg: rgba(47,125,47,0.08);
      --shadow: rgba(29,33,40,0.15); --overlay: rgba(29,33,40,0.55);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }

  .screen {
    display: none; position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
  }
  .screen.active { display: flex; flex-direction: column; align-items: center; }
  .inner { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
  .card-screen .inner { margin: auto 0; }
  #cardArea { width: 100%; display: flex; flex-direction: column; align-items: center; }

  /* ── ACCUEIL ── */
  .home h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 0.05em; color: var(--title); margin-top: 1rem; margin-bottom: 0.2rem; }
  .home h1 .g-der, .home h1 .g-die, .home h1 .g-das { font-weight: 600; }
  .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; text-align: center; line-height: 1.5; }
  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 0.6rem; width: 100%; }
  .mode-btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    color: var(--soft); font-size: 0.82rem; font-weight: 600; padding: 9px 8px;
    cursor: pointer; touch-action: manipulation; transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .mode-btn.active { background: var(--accent-bg); border-color: var(--accent-bd); color: var(--accent); }
  .mode-desc { font-size: 0.8rem; color: var(--soft); line-height: 1.5; text-align: center; margin-bottom: 0.9rem; min-height: 2.4em; }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-bottom: 1rem; }
  .stats-table th { font-weight: 400; color: var(--faint); text-align: right; padding: 2px 6px; font-size: 0.68rem; }
  .stats-table td { text-align: right; padding: 4px 6px; color: var(--soft); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line-2); }
  .stats-table td:first-child, .stats-table th:first-child { text-align: left; }
  .stats-table tr.cur td { color: var(--text); }
  .stats-table tr.cur td:first-child { color: var(--accent); font-weight: 600; }
  .stats-table td.due { font-weight: 700; }
  .stats-table tr.cur td.due { color: var(--accent); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--soft); margin-bottom: 0.8rem; cursor: pointer; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .start-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0.8rem; width: 100%; }
  .limit-box { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--soft); }
  .limit-box input {
    width: 4.2rem; padding: 8px; border-radius: 8px; text-align: center;
    background: var(--input-bg); border: 1px solid var(--line); color: var(--text); font-size: 0.9rem;
  }
  .start-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 0.8rem; }
  .start-btns button { padding: 13px 10px; }
  .section-title { width: 100%; font-size: 0.95rem; font-weight: 400; color: var(--title); margin: 0.6rem 0; padding-top: 1rem; border-top: 1px solid var(--line); }
  .file-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0.5rem; }
  .file-actions .wide, .wide { grid-column: 1 / -1; width: 100%; }
  .hint { font-size: 0.72rem; color: var(--faint); text-align: center; line-height: 1.5; margin: 0.4rem 0 1rem; }

  /* ── BOUTONS ── */
  button {
    padding: 13px 22px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; touch-action: manipulation; font-family: inherit; -webkit-user-select: none; user-select: none;
  }
  button:active:not(:disabled) { transform: scale(0.97); opacity: 0.88; }
  button:disabled { cursor: default; }
  button:focus-visible, .mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-main { background: var(--main); color: var(--main-text); }
  .btn-sub { background: var(--surface); color: var(--soft); border: 1px solid var(--line); font-size: 0.82rem; font-weight: 600; padding: 11px 12px; }
  .btn-danger { background: var(--ko-text) !important; color: #fff !important; }
  .kbd { font-size: 0.68rem; font-weight: 600; opacity: 0.7; margin-left: 6px; }
  @media (hover: none), (max-width: 420px) { .kbd { display: none; } }

  /* ── CARTE ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 0.6rem; gap: 8px; }
  .back-btn { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--soft); font-size: 0.82rem; font-weight: 600; padding: 6px 14px; white-space: nowrap; }
  .session-label { font-size: 0.8rem; color: var(--faint); text-align: right; }
  .progress-track { width: 100%; height: 4px; background: var(--line-2); border-radius: 2px; margin-bottom: 1.1rem; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .card {
    width: 100%; min-height: 250px; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.4rem 1.2rem; margin-bottom: 1rem;
  }
  .item-src { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.03em; margin-bottom: 0.2rem; text-align: center; }
  .item-box { font-size: 0.72rem; color: var(--accent); margin-bottom: 0.7rem; text-align: center; font-variant-numeric: tabular-nums; }
  .item-prompt { font-size: 1.75rem; font-weight: 700; color: var(--strong); text-align: center; line-height: 1.25; margin-bottom: 0.3rem; word-break: break-word; }
  .item-prompt.long { font-size: 1.25rem; }
  .item-sub { font-size: 0.9rem; color: var(--soft); text-align: center; line-height: 1.4; min-height: 1.2em; }
  .reveal { width: 100%; text-align: center; margin-top: 0.6rem; }
  .reveal:empty { display: none; }
  .reveal-main { font-size: 1.3rem; font-weight: 700; line-height: 1.35; word-break: break-word; }
  .reveal-fr { font-size: 0.92rem; color: var(--soft); margin-top: 0.2rem; line-height: 1.4; }
  .reveal-note { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; font-style: italic; }
  .verdict { font-size: 0.8rem; font-weight: 700; margin-top: 0.5rem; }
  .v-ok { color: var(--ok-text); } .v-ko { color: var(--ko-text); } .v-part { color: var(--part-text); }

  .g-der { color: var(--der); } .g-die { color: var(--die); } .g-das { color: var(--das); } .g-mix { color: var(--text); }

  .rule-box { text-align: left; border-left: 3px solid var(--accent-bd); background: var(--accent-bg); border-radius: 0 10px 10px 0; padding: 8px 11px; margin-top: 0.8rem; }
  .rule-head { font-weight: 700; color: var(--strong); font-size: 0.92rem; line-height: 1.4; }
  .rule-desc { font-size: 0.82rem; color: var(--soft); margin-top: 4px; line-height: 1.5; }
  .rule-src { font-size: 0.7rem; color: var(--faint); margin-top: 5px; }
  .chip { display: inline-block; font-size: 0.72rem; font-weight: 800; padding: 1px 7px; border-radius: 6px; border: 1px solid currentColor; margin-right: 6px; vertical-align: 1px; }
  .exc-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--part-text); border: 1px solid var(--part-text); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
  .wlist { text-align: left; font-size: 0.85rem; line-height: 1.65; margin-top: 0.6rem; }
  .wlist .lbl { font-size: 0.72rem; color: var(--faint); display: block; margin-top: 4px; }
  .wlist .fr { color: var(--muted); font-size: 0.78rem; }
  .wlist .mark { color: var(--part-text); font-weight: 700; }

  .buttons { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; width: 100%; margin-bottom: 0.6rem; }
  .gender-btn { min-width: 76px; padding: 13px 14px; background: var(--surface); border: 1.5px solid var(--line); }
  .gender-btn[data-g="der"] { color: var(--der); background: var(--der-bg); border-color: var(--der); }
  .gender-btn[data-g="die"] { color: var(--die); background: var(--die-bg); border-color: var(--die); }
  .gender-btn[data-g="das"] { color: var(--das); background: var(--das-bg); border-color: var(--das); }
  .combo .gender-btn { min-width: 64px; padding: 8px 10px; font-size: 0.8rem; color: var(--text); border-color: var(--soft); }
  .gender-btn.right, .opt-btn.right { box-shadow: 0 0 0 3px var(--ok-text); }
  .gender-btn.wrong, .opt-btn.wrong { box-shadow: 0 0 0 3px var(--ko-text); text-decoration: line-through; }
  .gender-btn.dim, .opt-btn.dim { opacity: 0.4; }
  .opt-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 0.6rem; }
  .opt-btn {
    text-align: left; background: var(--surface); border: 1.5px solid var(--line); color: var(--text);
    font-weight: 600; font-size: 0.9rem; padding: 11px 14px; border-radius: 12px; line-height: 1.35;
    display: flex; gap: 10px; align-items: baseline;
  }
  .opt-btn .num { color: var(--faint); font-size: 0.72rem; flex-shrink: 0; }
  .opt-btn .fr { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
  .stats { font-size: 0.74rem; color: var(--faint); line-height: 1.8; text-align: center; }
  .stats b { color: var(--soft); }
  .done-box { text-align: center; padding: 2rem 0.5rem; width: 100%; }
  .done-box h2 { font-size: 1.7rem; font-weight: 300; color: var(--ok-text); margin-bottom: 1rem; }
  .done-box p { color: var(--muted); margin-bottom: 1rem; line-height: 1.6; }
  .done-box .wlist { margin-bottom: 1.2rem; }
  .done-box .btn-main { margin-bottom: 12px; min-width: 210px; }

  /* ── MODALE ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--modal-bg); border: 1px solid var(--accent-bd); border-radius: 16px; width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal.tall { height: 88vh; }
  .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-size: 1rem; font-weight: 600; color: var(--title); }
  .modal-close { background: transparent; color: var(--soft); font-size: 1.5rem; line-height: 1; padding: 0 8px; font-weight: 300; }
  .modal-body { padding: 14px 18px; overflow-y: auto; flex: 1; font-size: 0.85rem; line-height: 1.55; -webkit-user-select: text; user-select: text; }
  .modal-body p { margin-bottom: 0.6rem; }
  .modal-footer { padding: 12px 18px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-footer:empty { display: none; }
  .modal-footer button { padding: 10px 16px; font-size: 0.85rem; border-radius: 10px; flex: 1; min-width: 100px; }
  .ref-search { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--accent-bd); background: var(--input-bg); color: var(--strong); font-size: 0.95rem; outline: none; margin-bottom: 10px; }
  .ref-fam { font-size: 0.9rem; font-weight: 600; color: var(--title); margin: 14px 0 6px; }
  .ref-fam:first-child { margin-top: 0; }
  details.ref-rule { border-bottom: 1px solid var(--line-2); padding: 5px 0; }
  details.ref-rule summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 4px; }
  details.ref-rule summary::-webkit-details-marker { display: none; }
  details.ref-rule summary .cnt { margin-left: auto; color: var(--faint); font-size: 0.72rem; font-variant-numeric: tabular-nums; padding-left: 8px; }
  details.ref-rule[open] summary { color: var(--strong); }
  .ref-body { padding: 4px 0 8px 2px; }
  .ref-hit { padding: 5px 0; border-bottom: 1px solid var(--line-2); }
  .ref-hit .rl { display: block; font-size: 0.76rem; color: var(--muted); }


  /* ── LISTES IMPORTÉES ── */
  .imp-panel { width: 100%; margin-bottom: 0.4rem; }
  .src-list { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 0.8rem; }
  .src-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px 8px 12px; cursor: pointer; touch-action: manipulation; transition: border-color 0.2s, background 0.2s, opacity 0.2s; }
  .src-card.sel { border-color: var(--accent-bd); background: var(--accent-bg); }
  .src-card:not(.sel) { opacity: 0.5; }
  .src-head { display: flex; align-items: center; gap: 8px; }
  .check { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; border: 1.5px solid var(--soft); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; color: transparent; }
  .src-card.sel .check { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .src-name { font-weight: 700; color: var(--title); font-size: 0.95rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-type { font-size: 0.7rem; color: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .src-del { background: none; border: none; color: var(--faint); font-size: 1.3rem; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .src-del:hover { color: var(--ko-text); }
  .src-meta { font-size: 0.74rem; color: var(--muted); margin: 3px 0 0 28px; font-variant-numeric: tabular-nums; }
  .empty { width: 100%; text-align: center; color: var(--muted); font-size: 0.82rem; line-height: 1.6; border: 1px dashed var(--line); border-radius: 12px; padding: 1.1rem 1rem; margin-bottom: 0.8rem; }
  .empty code { color: var(--title); font-family: inherit; font-weight: 600; }
  .drop-overlay { display: none; position: fixed; inset: 0; z-index: 500; background: var(--overlay); border: 3px dashed var(--accent); border-radius: 18px; margin: 10px; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; font-weight: 600; text-align: center; padding: 1rem; }
  .drop-overlay.show { display: flex; }
  .rep-file { margin-bottom: 0.7rem; }
  .rep-file b { color: var(--title); }
  .rep-skip { font-size: 0.75rem; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--modal-bg); color: var(--text); border: 1px solid var(--accent-bd);
    border-radius: 10px; padding: 10px 16px; font-size: 0.85rem; z-index: 400;
    box-shadow: 0 6px 20px var(--shadow); max-width: 90vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 370px) {
    .item-prompt { font-size: 1.45rem; }
    button { padding: 12px 16px; font-size: 0.88rem; }
    .gender-btn { min-width: 64px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- ═══════════ ACCUEIL ═══════════ -->
<div class="screen home active" id="screenHome">
  <div class="inner">
    <h1><span class="g-der">der</span> <span class="g-die">die</span> <span class="g-das">das</span></h1>
    <div class="subtitle">Règles du genre des noms allemands, en répétition espacée<br>Boîtes : 0, 1, 3, 7, 14, 21, 31 j, puis entretien tous les 90 j</div>

    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn" data-mode="r">Règles</button>
      <button class="mode-btn" data-mode="i">Intrus</button>
      <button class="mode-btn" data-mode="mgr">MGR : mot → genre → règle</button>
      <button class="mode-btn" data-mode="mrg">MRG : mot → règle → genre</button>
      <button class="mode-btn wide" data-mode="imp">Listes importées : mot → genre</button>
    </div>
    <div class="mode-desc" id="modeDesc"></div>

    <div class="imp-panel" id="impPanel" style="display:none">
      <div class="src-list" id="srcList"></div>
      <button class="btn-sub wide" id="importListBtn" style="margin-bottom:0.9rem">Importer des listes (.txt)</button>
    </div>

    <table class="stats-table" id="statsTable"></table>

    <label class="check-row" id="gramRow"><input type="checkbox" id="gramCheck"> Inclure les mots des grammaires (en plus de la liste B1)</label>

    <div class="start-row">
      <label class="limit-box"><span id="limitLabel">Cartes par séance</span>
        <input type="number" id="limitInput" min="1" max="500" inputmode="numeric">
      </label>
    </div>
    <div class="start-btns">
      <button class="btn-main" id="reviewBtn">Réviser</button>
      <button class="btn-main" id="newBtn">Nouveaux</button>
    </div>
    <button class="btn-sub wide" id="refBtn">Consulter les règles et chercher un mot</button>

    <div class="section-title">Sauvegarde</div>
    <div class="file-actions">
      <button class="btn-sub" id="exportBtn">Exporter la sauvegarde</button>
      <button class="btn-sub" id="importBtn">Importer une sauvegarde</button>
      <button class="btn-sub wide" id="resetBtn">Réinitialiser la progression</button>
    </div>
    <div class="hint" id="hintData"></div>
  </div>
</div>

<!-- ═══════════ SÉANCE ═══════════ -->
<div class="screen card-screen" id="screenCard">
  <div class="inner">
    <div class="top-bar">
      <button class="back-btn" id="backBtn">← Accueil</button>
      <span class="session-label" id="sessionLabel"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div id="cardArea">
      <div class="card">
        <div class="item-src" id="itemSrc"></div>
        <div class="item-box" id="itemBox"></div>
        <div class="item-prompt" id="itemPrompt"></div>
        <div class="item-sub" id="itemSub"></div>
        <div class="reveal" id="reveal"></div>
      </div>
      <div class="buttons" id="btnsGender" style="display:none"></div>
      <div class="buttons combo" id="btnsCombo" style="display:none"></div>
      <div class="opt-list" id="optList" style="display:none"></div>
      <div class="buttons" id="btnsNext" style="display:none">
        <button class="btn-main" id="nextBtn">Continuer<span class="kbd">Entrée</span></button>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="done-box" id="doneBox" style="display:none">
      <h2>✓ Séance terminée</h2>

var SRC_NAME = { L: 'Liste B1', A: 'Bescherelle', B: 'L’allemand de A à Z' };
var ART = { der: 'der', die: 'die', das: 'das', derdie: 'der/die', derdas: 'der/das', dasdie: 'das/die', pl: 'pluriel' };
var MAIN_G = ['der', 'das', 'die'];
var COMBO_G = ['derdie', 'derdas', 'dasdie'];

// ═══════════════════════════════════
// DONNÉES
// ═══════════════════════════════════
var FAM = {}; DATA.fams.forEach(function (f) { FAM[f[0]] = f[1]; });
var RULES = DATA.rules;
var R = {}; RULES.forEach(function (r) { R[r.id] = r; });
var WORDS = DATA.words.map(function (a) {
  return { w: a[0], n: a[1], g: a[2], fr: a[3], k: a[4], alt: a[5] ? a[5].split(',') : [], note: a[6], s: a[7] };
});
var W = {}; WORDS.forEach(function (x) { W[x.w] = x; });
function rk(k) { return k.replace('!', ''); }
function isExc(k) { return k.charAt(k.length - 1) === '!'; }
var BYRULE = {};
WORDS.forEach(function (x) {
  if (x.k === 'none') return;
  var r = rk(x.k);
  if (!BYRULE[r]) BYRULE[r] = { reg: [], exc: [] };
  BYRULE[r][isExc(x.k) ? 'exc' : 'reg'].push(x);
});
var ALLKEYS = [], FAMKEYS = {};
(function () {
  var seen = {};
  WORDS.forEach(function (x) {
    [x.k].concat(x.alt).forEach(function (k) {
      if (k === 'none' || seen[k]) return;
      seen[k] = true; ALLKEYS.push(k);
      var f = R[rk(k)].f;
      (FAMKEYS[f] = FAMKEYS[f] || []).push(k);
    });
  });
})();
function isFixed(g) { return g === 'der' || g === 'die' || g === 'das'; }
// Index du vocabulaire intégré par genre + nom (pour afficher la règle d'un mot importé)
var GN = {};
WORDS.forEach(function (x) { GN[x.g + '|' + norm(x.n)] = x; });

function unitsOf(mode) {
  if (mode === 'r') return RULES.filter(function (r) { return isFixed(r.g); }).map(function (r) { return r.id; });
  if (mode === 'mrg') return RULES.filter(function (r) { var b = BYRULE[r.id]; return b && b.reg.length + b.exc.length > 0; }).map(function (r) { return r.id; });
  if (mode === 'i') return RULES.filter(function (r) { var b = BYRULE[r.id]; return b && b.exc.length >= 1 && b.reg.length >= 3; }).map(function (r) { return r.id; });
  if (mode === 'imp') return Object.keys(impEntries());
  return WORDS.filter(function (x) { return data.settings.gram || x.s === 'L'; }).map(function (x) { return x.w; });
}
// Mots des listes importées sélectionnées, dédoublonnés (clé : « der Hund »)
function impEntries() {
  var out = {};
  sortedLists().forEach(function (L) {
    if (data.settings.deselected[L.id]) return;
    L.entries.forEach(function (e) {
      var gi = genderOf(e.de);
      if (!gi) return;
      if (!out[e.de]) out[e.de] = { de: e.de, fr: e.fr, g: gi.g, noun: gi.noun, lists: [] };
      out[e.de].lists.push(L.name);
    });
  });
  return out;
}
function sortedLists() {
  return Object.keys(data.lists).map(function (id) { return data.lists[id]; })
    .sort(function (a, b) { return a.name.localeCompare(b.name, 'fr'); });
}

// ═══════════════════════════════════
// SAUVEGARDE
// ═══════════════════════════════════
function freshData() {
  return { version: 2, progress: {}, lists: {}, settings: { mode: 'mgr', gram: true, deselected: {}, limits: { r: 10, i: 10, mgr: 20, mrg: 4, imp: 20 } } };
}
var data = freshData();
var storageOk = true;
function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) adopt(JSON.parse(raw));
  } catch (e) { storageOk = false; }
}
function adopt(obj) {
  var d = freshData();
  if (obj && typeof obj === 'object') {
    if (obj.progress && typeof obj.progress === 'object') d.progress = obj.progress;
    if (obj.lists && typeof obj.lists === 'object') Object.keys(obj.lists).forEach(function (id) {
      var L = obj.lists[id];
      if (L && typeof L.name === 'string' && Array.isArray(L.entries)) d.lists[id] = L;
    });
    if (obj.settings) {
      if (MODES[obj.settings.mode]) d.settings.mode = obj.settings.mode;
      if (typeof obj.settings.gram === 'boolean') d.settings.gram = obj.settings.gram;
      if (obj.settings.deselected && typeof obj.settings.deselected === 'object') d.settings.deselected = obj.settings.deselected;
      if (obj.settings.limits) MODE_ORDER.forEach(function (m) {
        var v = parseInt(obj.settings.limits[m], 10);
        if (v > 0) d.settings.limits[m] = Math.min(500, v);
      });
    }
  }
  data = d;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); storageOk = true; }
  catch (e) { storageOk = false; }
}

// ═══════════════════════════════════
// OUTILS
// ═══════════════════════════════════
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function gcls(g) { return isFixed(g) ? 'g-' + g : (g === 'pl' ? 'g-die' : 'g-mix'); }
function wordHTML(x) { return '<span class="' + gcls(x.g) + '">' + esc(x.w) + '</span>'; }
function frHTML(x) { return ' <span class="fr">' + esc(x.fr) + '</span>'; }
function chip(g) { return isFixed(g) || ART[g] ? '<span class="chip ' + gcls(g) + '">' + ART[g] + '</span>' : ''; }
function keyLabel(k) { return (isExc(k) ? 'Exception : ' : '') + R[rk(k)].l; }
function pkey(mode, id) { return mode + '\t' + id; }
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
var toastTimer = null;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('active', s.id === id); });
}

// Bloc d'explication d'une règle (clé avec « ! » = exception)
function ruleHTML(k, withGender) {
  var r = R[rk(k)];
  var head = (isExc(k) ? '<span class="exc-tag">Exception</span>' : '') +
             (withGender && isFixed(r.g) ? chip(r.g) : '') + esc(r.l);
  return '<div class="rule-box"><div class="rule-head">' + head + '</div>' +
         (withGender ? '<div class="rule-desc">' + esc(r.d) + '</div>' : '') +
         '<div class="rule-src">' + esc(FAM[r.f]) + ' · ' + esc(r.s) + '</div></div>';
}

// ═══════════════════════════════════
// LEITNER
// ═══════════════════════════════════
function isMastered(p) { return !!p && p.box >= MAINT_BOX; }
function boxLabel(p) {
  if (!p) return 'Nouveau';
  if (p.box >= MAINT_BOX) return 'Entretien · ' + INTERVALS[MAINT_BOX - 1] + ' j';
  return 'Boîte ' + p.box + ' · ' + INTERVALS[p.box - 1] + ' j';
}
// res : 'ok' | 'partial' | 'ko' ; requeue : la carte ratée revient dans la séance
function applyResult(key, res, requeue) {
  var p = data.progress[key] || { box: 1, ok: 0, due: today() };
  if (res === 'ok') {
    if (session.retry[key]) { p.box = 1; p.ok = 0; p.due = addDays(1); }
    else {
      if (p.box < MAINT_BOX) {
        p.ok = (p.ok || 0) + 1;
        if (p.ok >= REQUIRED[p.box - 1]) { p.box++; p.ok = 0; }
      }
      p.due = addDays(INTERVALS[Math.min(p.box, MAINT_BOX) - 1]);
    }
  } else if (res === 'partial') {
    p.ok = 0; p.due = addDays(1);
  } else {
    p.box = 1; p.ok = 0;
    p.due = requeue ? today() : addDays(1);
    if (requeue) session.retry[key] = true;
  }
  p.last = today();
  data.progress[key] = p;
  save();
}
function statsFor(mode) {
  var u = unitsOf(mode), t = today(), s = { total: u.length, fresh: 0, due: 0, mastered: 0 };
  u.forEach(function (id) {
    var p = data.progress[pkey(mode, id)];
    if (!p) s.fresh++;
    else { if (p.due <= t) s.due++; if (isMastered(p)) s.mastered++; }
  });
  return s;
}

// ═══════════════════════════════════
// ACCUEIL
// ═══════════════════════════════════
function renderHome() {
  var mode = data.settings.mode;
  document.querySelectorAll('#modeToggle .mode-btn').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-mode') === mode);
  });
  $('modeDesc').textContent = MODES[mode].desc;
  var h = '<tr><th></th><th>À réviser</th><th>Nouveaux</th><th>Maîtrisés</th><th>Total</th></tr>';
  MODE_ORDER.forEach(function (m) {
    var s = statsFor(m);
    h += '<tr class="' + (m === mode ? 'cur' : '') + '"><td>' + esc(MODES[m].short) + '</td><td class="due">' + s.due +
         '</td><td>' + s.fresh + '</td><td>' + s.mastered + '</td><td>' + s.total + '</td></tr>';
  });
  $('statsTable').innerHTML = h;
  $('gramRow').style.display = mode === 'mgr' ? '' : 'none';

  $('newBtn').disabled = !s.fresh; $('newBtn').style.opacity = s.fresh ? '' : '0.4';
  var nL = WORDS.filter(function (x) { return x.s === 'L'; }).length;
  $('hintData').innerHTML = esc(RULES.length + ' règles · ' + nL + ' mots de la liste B1 · ' + (WORDS.length - nL) +
    ' mots tirés du Bescherelle et de L’allemand de A à Z.') +
    '<br>Listes importées : fichiers Genre_&lt;Nom&gt;.txt ou Vocabulaire_&lt;Nom&gt;.txt (lignes « der Hund – chien »). Vous pouvez aussi les glisser-déposer sur cette page.' + '<br>La progression est enregistrée dans ce navigateur ; exportez-la régulièrement.' +
    (storageOk ? '' : '<br><b class="v-ko">Stockage local indisponible : la progression sera perdue à la fermeture.</b>') +
    '<br>Genre des noms ' + APP_VERSION;
}
function setMode(m) { data.settings.mode = m; save(); renderHome(); }

// ═══════════════════════════════════
// SÉANCE
// ═══════════════════════════════════
var session = null, cur = null, phase = '';

function pickUnits(mode, kind, limit) {
  var t = today(), u = unitsOf(mode), out;
  if (kind === 'review') {
    out = u.filter(function (id) { var p = data.progress[pkey(mode, id)]; return p && p.due <= t; });
    out.sort(function (a, b) { return data.progress[pkey(mode, a)].due < data.progress[pkey(mode, b)].due ? -1 : 1; });
    out = shuffle(out.slice(0, limit));
  } else {
    out = u.filter(function (id) { return !data.progress[pkey(mode, id)]; });
    out = mode === 'mgr' ? shuffle(out).slice(0, limit) : out.slice(0, limit);
  }
  return out;
}

// Tire jusqu'à 5 mots d'une règle, dont une ou deux exceptions si elle en a
function sampleRuleWords(id) {
  var b = BYRULE[id], reg = shuffle(b.reg.slice()), exc = shuffle(b.exc.slice());
  var nExc = Math.min(exc.length, Math.random() < 0.5 ? 1 : 2);
  var pick = exc.slice(0, nExc);
  pick = pick.concat(reg.slice(0, 5 - pick.length));
  if (pick.length < 5) pick = pick.concat(exc.slice(nExc, nExc + 5 - pick.length));
  return pick;
}
// Mélange en évitant deux mots consécutifs de la même règle
function interleave(items) {
  var pool = shuffle(items.slice()), out = [];
  while (pool.length) {
    var last = out.length ? out[out.length - 1].rule : null, idx = 0;
    for (var i = 0; i < pool.length; i++) { if (pool[i].rule !== last) { idx = i; break; } }
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

function startSession(kind) {
  var mode = data.settings.mode;
  var limit = data.settings.limits[mode];
  var ids = pickUnits(mode, kind, limit);
  if (!ids.length) { toast(kind === 'review' ? 'Rien à réviser aujourd’hui dans ce mode.' : 'Plus aucune carte nouvelle dans ce mode.'); return; }
  session = { mode: mode, kind: kind, queue: [], done: 0, ok: 0, partial: 0, ko: 0, retry: {}, rules: [], ruleRes: {}, keys: [] };
  if (mode === 'mrg') {
    var items = [];
    ids.forEach(function (id) {
      session.rules.push(id);
      session.ruleRes[id] = { n: 0, ok: 0, bad: [] };
      sampleRuleWords(id).forEach(function (x) { items.push({ t: 'mrg', word: x, rule: id }); });
    });
    session.keys = ids.slice();
    session.queue = interleave(items);
  } else {
    if (mode === 'imp') session.imp = impEntries();
    session.queue = ids.map(function (id) { return { t: mode, id: id }; });
  }
  $('doneBox').style.display = 'none';
  $('cardArea').style.display = '';
  showScreen('screenCard');
  nextItem();
}

function hideButtons() {
  ['btnsGender', 'btnsCombo', 'optList', 'btnsNext'].forEach(function (id) { $(id).style.display = 'none'; });
}
function updateProgressUI() {
  var pending = cur && !cur.counted ? 1 : 0;
  var total = session.done + session.queue.length + pending;
  $('progressFill').style.width = (total ? Math.round(100 * session.done / total) : 0) + '%';
  $('sessionLabel').textContent = MODES[session.mode].label + ' · ' + (session.done + pending) + '/' + total;
  $('stats').innerHTML = '<b class="v-ok">✓ ' + session.ok + '</b>   ' +
    (session.mode === 'mgr' ? '<b class="v-part">½ ' + session.partial + '</b>   ' : '') +
    '<b class="v-ko">✗ ' + session.ko + '</b>';
}

function nextItem() {
  hideButtons();
  cur = session.queue.shift() || null;
  if (!cur) { finishSession(); return; }
  $('reveal').innerHTML = '';
  $('itemPrompt').classList.remove('long');
  updateProgressUI();
  if (cur.t === 'r') showRuleCard();
  else if (cur.t === 'i') showIntrusCard();
  else if (cur.t === 'mgr') showMgrCard();
  else if (cur.t === 'imp') showImpCard();
  else showMrgCard();
}

function setPrompt(src, box, prompt, sub) {
  $('itemSrc').textContent = src;
  $('itemBox').textContent = box;
  $('itemPrompt').textContent = prompt;
  $('itemPrompt').classList.toggle('long', prompt.length > 22);
  $('itemSub').textContent = sub || '';
}

// ── Boutons de genre ──
function showGenderButtons(withCombos, withPlural) {
  var b = $('btnsGender'), c = $('btnsCombo');
  b.innerHTML = MAIN_G.map(function (g, i) {
    return '<button class="gender-btn" data-g="' + g + '">' + ART[g] + '<span class="kbd">' + (i + 1) + '</span></button>';
  }).join('');
  b.style.display = '';
  if (withCombos) {
    c.innerHTML = COMBO_G.concat(withPlural ? ['pl'] : []).map(function (g, i) {
      return '<button class="gender-btn" data-g="' + g + '">' + ART[g] + '<span class="kbd">' + (i + 4) + '</span></button>';
    }).join('');
    c.style.display = '';
  }
  phase = 'gender';
}
function markGender(chosen, right) {
  document.querySelectorAll('#btnsGender .gender-btn, #btnsCombo .gender-btn').forEach(function (btn) {
    var g = btn.getAttribute('data-g');
    btn.disabled = true;
    if (g === right) btn.classList.add('right');
    else if (g === chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
}

// ── Options (règles ou mots) ──
function showOptions(opts) {   // opts : [{key, html}]
  var box = $('optList');
  box.innerHTML = opts.map(function (o, i) {
    return '<button class="opt-btn" data-k="' + esc(o.key) + '"><span class="num">' + (i + 1) + '</span><span>' + o.html + '</span></button>';
  }).join('');
  box.style.display = '';
  phase = 'opt';
}
function markOptions(chosen, isRight) {
  document.querySelectorAll('#optList .opt-btn').forEach(function (btn) {
    var k = btn.getAttribute('data-k');
    btn.disabled = true;
    if (isRight(k)) btn.classList.add('right');
    else if (k === chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
}
function accepted(x) { return [x.k].concat(x.alt); }
// Quatre règles proposées : la bonne et trois leurres plausibles
function ruleOptions(x, sessionKeys) {
  var acc = accepted(x), correct = x.k, picks = [];
  function tryAdd(k) {
    if (picks.length >= 3 || !k || k === 'none' || !R[rk(k)]) return;
    if (acc.indexOf(k) >= 0 || picks.indexOf(k) >= 0) return;
    picks.push(k);
  }
  if (isExc(correct)) tryAdd(rk(correct));
  else if (BYRULE[correct] && BYRULE[correct].exc.length && Math.random() < 0.3) tryAdd(correct + '!');
  var lim = picks.length + 1;            // au plus un leurre tiré de la séance…
  shuffle((sessionKeys || []).slice()).forEach(function (k) { if (picks.length < lim) tryAdd(k); });
  lim = picks.length + 1;                // …et un seul de la même famille de règles
  shuffle((FAMKEYS[R[rk(correct)].f] || []).slice()).forEach(function (k) { if (picks.length < lim) tryAdd(k); });
  shuffle(ALLKEYS.slice()).forEach(tryAdd);
  return shuffle([correct].concat(picks)).map(function (k) { return { key: k, html: esc(keyLabel(k)) }; });
}
function showNext() { $('btnsNext').style.display = ''; phase = 'next'; }
function verdict(res) {
  var t = { ok: ['v-ok', '✓ Juste'], partial: ['v-part', '½ Genre juste, règle fausse'], ko: ['v-ko', '✗ Faux'] }[res];
  return '<div class="verdict ' + t[0] + '">' + t[1] + '</div>';
}
function wordReveal(x) {
  return '<div class="reveal-main">' + wordHTML(x) + '</div><div class="reveal-fr">' + esc(x.fr) + '</div>' +
         (x.note ? '<div class="reveal-note">' + esc(x.note) + '</div>' : '');
}
function noRuleBox() {
  return '<div class="rule-box"><div class="rule-head">Sans règle fiable</div><div class="rule-desc">Aucune règle de forme ou de sens ne permet de prévoir ce genre : à mémoriser.</div></div>';
}
function tally(res) { session[res]++; session.done++; if (cur) cur.counted = true; }

// ── Mode Règles ──
function showRuleCard() {
  var r = R[cur.id], key = pkey('r', r.id);
  setPrompt(FAM[r.f], boxLabel(data.progress[key]), r.l, 'Quel genre cette règle donne-t-elle ?');
  showGenderButtons(false);
  cur.answer = function (g) {
    var ok = g === r.g;
    markGender(g, r.g);
    var b = BYRULE[r.id] || { reg: [], exc: [] };
    var ex = shuffle(b.reg.slice()).slice(0, 6), exc = b.exc.slice(0, 10);
    var h = ruleHTML(r.id, true);
    if (ex.length) h += '<div class="wlist"><span class="lbl">Exemples</span>' + ex.map(function (x) { return wordHTML(x) + frHTML(x); }).join('<br>') + '</div>';
    if (exc.length) h += '<div class="wlist"><span class="lbl">Exceptions</span>' + exc.map(function (x) { return wordHTML(x) + frHTML(x); }).join('<br>') + '</div>';
    $('reveal').innerHTML = verdict(ok ? 'ok' : 'ko') + h;
    finishItem(key, ok ? 'ok' : 'ko', true);
  };
}

// ── Mode Intrus ──
function showIntrusCard() {
  var r = R[cur.id], key = pkey('i', r.id), b = BYRULE[r.id];
  if (!cur.words) {
    var odd = b.exc[Math.floor(Math.random() * b.exc.length)];
    cur.odd = odd;
    cur.words = shuffle(shuffle(b.reg.slice()).slice(0, 3).concat([odd]));
  }
  setPrompt(FAM[r.f], boxLabel(data.progress[key]), r.l, 'Quel mot fait exception ?');
  showOptions(cur.words.map(function (x) { return { key: x.w, html: esc(x.n) + ' <span class="fr">' + esc(x.fr) + '</span>' }; }));
  cur.choose = function (k) {
    var ok = k === cur.odd.w;
    markOptions(k, function (kk) { return kk === cur.odd.w; });
    var h = '<div class="wlist">' + cur.words.map(function (x) {
      return wordHTML(x) + frHTML(x) + (x === cur.odd ? ' <span class="mark">← exception</span>' : '');
    }).join('<br>') + '</div>';
    $('reveal').innerHTML = verdict(ok ? 'ok' : 'ko') + h + ruleHTML(r.id, true);
    finishItem(key, ok ? 'ok' : 'ko', true);
  };
}

// ── Mode Mot → genre → règle ──
function showMgrCard() {
  var x = W[cur.id], key = pkey('mgr', x.w);
  setPrompt(SRC_NAME[x.s], boxLabel(data.progress[key]), x.n, x.fr);
  showGenderButtons(true);
  cur.answer = function (g) {
    var okG = g === x.g;
    markGender(g, x.g);
    if (x.k === 'none') {
      $('reveal').innerHTML = verdict(okG ? 'ok' : 'ko') + wordReveal(x) + noRuleBox();
      finishItem(key, okG ? 'ok' : 'ko', true);
      return;
    }
    cur.okG = okG;
    $('reveal').innerHTML = '<div class="verdict ' + (okG ? 'v-ok">✓ Genre juste' : 'v-ko">✗ Genre faux : ' + esc(ART[x.g])) + '</div><div class="reveal-fr">Quelle règle l’explique ?</div>';
    $('btnsGender').style.display = 'none'; $('btnsCombo').style.display = 'none';
    showOptions(ruleOptions(x, null));
    cur.choose = function (k) {
      var acc = accepted(x), okR = acc.indexOf(k) >= 0;
      markOptions(k, function (kk) { return acc.indexOf(kk) >= 0; });
      var res = !cur.okG ? 'ko' : (okR ? 'ok' : 'partial');
      $('reveal').innerHTML = verdict(res) + wordReveal(x) + ruleHTML(x.k, true);
      finishItem(key, res, res === 'ko');
    };
  };
}

// ── Mode Mot → règle → genre ──
function showMrgCard() {
  var x = cur.word, key = pkey('mrg', cur.rule);
  setPrompt(SRC_NAME[x.s], 'Règle : ' + boxLabel(data.progress[key]).toLowerCase(), x.n, x.fr);
  showOptions(ruleOptions(x, session.keys));
  cur.choose = function (k) {
    var acc = accepted(x), okR = acc.indexOf(k) >= 0;
    cur.okR = okR;
    markOptions(k, function (kk) { return acc.indexOf(kk) >= 0; });
    $('reveal').innerHTML = '<div class="verdict ' + (okR ? 'v-ok">✓ Règle juste' : 'v-ko">✗ Règle fausse') + '</div>' + ruleHTML(x.k, false);
    setTimeout(function () {
      $('optList').style.display = 'none';
      showGenderButtons(true);
    }, 350);
    phase = 'wait';
    cur.answer = function (g) {
      var okG = g === x.g, ok = cur.okR && okG;
      markGender(g, x.g);
      var rr = session.ruleRes[cur.rule];
      rr.n++; if (ok) rr.ok++; else rr.bad.push(x);
      var res = ok ? 'ok' : 'ko';
      $('reveal').innerHTML = verdict(res) + wordReveal(x) + ruleHTML(x.k, true);
      tally(res);
      updateProgressUI();
      showNext();
    };
  };
}

// ── Listes importées : mot → genre ──
function showImpCard() {
  var e = session.imp[cur.id], key = pkey('imp', cur.id);
  if (!e) { nextItem(); return; }
  setPrompt(e.lists.join(', '), boxLabel(data.progress[key]), e.noun, e.fr);
  showGenderButtons(true, true);
  cur.answer = function (g) {
    var ok = g === e.g;
    markGender(g, e.g);
    var x = { w: e.de, g: e.g === 'pl' ? 'die' : e.g, fr: e.fr, note: '' };
    var h = verdict(ok ? 'ok' : 'ko') + wordReveal(x);
    var bw = W[e.de] || GN[e.g + '|' + norm(e.noun)];
    if (bw) h += (bw.note ? '<div class="reveal-note">' + esc(bw.note) + '</div>' : '') + (bw.k === 'none' ? noRuleBox() : ruleHTML(bw.k, true));
    $('reveal').innerHTML = h;
    finishItem(key, ok ? 'ok' : 'ko', true);
  };
}

function finishItem(key, res, requeue) {
  applyResult(key, res, requeue);
  tally(res);
  if (res === 'ko' && requeue) {
    var again = { t: cur.t, id: cur.id };
    session.queue.splice(Math.min(session.queue.length, 3), 0, again);
  }
  updateProgressUI();
  showNext();
}

function finishSession() {
  cur = null; phase = 'done';
  $('cardArea').style.display = 'none';
  $('doneBox').style.display = '';
  $('progressFill').style.width = '100%';
  var det = '';
  if (session.mode === 'mrg') {
    var okRules = [], badRules = [];
    session.rules.forEach(function (id) {
      var rr = session.ruleRes[id], ok = rr.n > 0 && rr.ok === rr.n;
      applyResult(pkey('mrg', id), ok ? 'ok' : 'ko', false);
      (ok ? okRules : badRules).push(id);
    });
    $('doneSummary').textContent = okRules.length + ' règle(s) validée(s) sur ' + session.rules.length + '.';
    det = session.rules.map(function (id) {
      var rr = session.ruleRes[id], ok = okRules.indexOf(id) >= 0;
      return '<span class="' + (ok ? 'v-ok' : 'v-ko') + '">' + (ok ? '✓ ' : '✗ ') + '</span>' + esc(R[id].l) + ' <span class="fr">' + rr.ok + '/' + rr.n + '</span>' +
        (rr.bad.length ? '<br><span class="fr">   à revoir : </span>' + rr.bad.map(wordHTML).join(', ') : '');
    }).join('<br>');
  } else {
    $('doneSummary').textContent = session.ok + ' juste(s)' + (session.mode === 'mgr' ? ', ' + session.partial + ' partielle(s)' : '') + ', ' + session.ko + ' faute(s).';
  }
  $('doneDetail').innerHTML = det;
}

function goHome() { session = null; cur = null; phase = ''; hideButtons(); showScreen('screenHome'); renderHome(); }

// ═══════════════════════════════════
// RÉFÉRENCE DES RÈGLES
// ═══════════════════════════════════
var modalOnClose = null;
function openModal(title, bodyHTML, footerHTML, tall) {
  document.querySelector('#modal .modal').classList.toggle('tall', !!tall);
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  $('modalFooter').innerHTML = footerHTML || '';
  $('modal').classList.add('show');
}
function closeModal() { $('modal').classList.remove('show'); if (modalOnClose) { var f = modalOnClose; modalOnClose = null; f(); } }

function refRuleBody(r) {
  var b = BYRULE[r.id] || { reg: [], exc: [] };
  var h = '<div class="ref-body"><div class="rule-desc">' + esc(r.d) + '</div><div class="rule-src">' + esc(r.s) + '</div>';
  if (b.reg.length) h += '<div class="wlist"><span class="lbl">Mots (' + b.reg.length + ')</span>' + b.reg.map(function (x) { return wordHTML(x) + frHTML(x); }).join('<br>') + '</div>';
  if (b.exc.length) h += '<div class="wlist"><span class="lbl">Exceptions (' + b.exc.length + ')</span>' + b.exc.map(function (x) { return wordHTML(x) + frHTML(x); }).join('<br>') + '</div>';
  return h + '</div>';
}
function openReference() {
  var h = '<input class="ref-search" id="refSearch" type="search" placeholder="Chercher un mot (allemand ou français)" autocomplete="off"><div id="refList"></div>';
  openModal('Règles du genre', h, '', true);
  renderRefList('');
  $('refSearch').addEventListener('input', function () { renderRefList(this.value); });
}
function renderRefList(q) {
  var box = $('refList');
  q = norm(q.trim());
  if (q.length >= 2) {
    var hits = WORDS.filter(function (x) { return norm(x.n).indexOf(q) >= 0 || norm(x.fr).indexOf(q) >= 0; }).slice(0, 80);
    box.innerHTML = hits.length ? hits.map(function (x) {
      var rl = x.k === 'none' ? 'Sans règle fiable' : keyLabel(x.k);
      return '<div class="ref-hit">' + wordHTML(x) + frHTML(x) + '<span class="rl">' + esc(rl) + (x.note ? ' — ' + esc(x.note) : '') + '</span></div>';
    }).join('') : '<p class="fr">Aucun mot trouvé.</p>';
    return;
  }
  var h = '';
  DATA.fams.forEach(function (f) {
    h += '<div class="ref-fam">' + esc(f[1]) + '</div>';
    RULES.filter(function (r) { return r.f === f[0]; }).forEach(function (r) {
      var b = BYRULE[r.id] || { reg: [], exc: [] };
      h += '<details class="ref-rule" data-id="' + r.id + '"><summary>' + (isFixed(r.g) || ART[r.g] ? chip(r.g) : '') + '<span>' + esc(r.l) + '</span><span class="cnt">' +
           b.reg.length + (b.exc.length ? ' + ' + b.exc.length + ' exc.' : '') + '</span></summary></details>';
    });
  });
  var none = WORDS.filter(function (x) { return x.k === 'none'; });
  h += '<div class="ref-fam">Sans règle fiable</div><details class="ref-rule" data-id="none"><summary><span>Mots à mémoriser</span><span class="cnt">' + none.length + '</span></summary></details>';
  box.innerHTML = h;
  box.querySelectorAll('details.ref-rule').forEach(function (d) {
    d.addEventListener('toggle', function () {
      if (!d.open || d.getAttribute('data-filled')) return;
      d.setAttribute('data-filled', '1');
      var id = d.getAttribute('data-id'), div = document.createElement('div');
      if (id === 'none') div.innerHTML = '<div class="ref-body"><div class="wlist">' + none.map(function (x) { return wordHTML(x) + frHTML(x); }).join('<br>') + '</div></div>';
      else div.innerHTML = refRuleBody(R[id]);
      d.appendChild(div.firstChild);
    });
  });
}

// ═══════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════
function exportSave() {
  var obj = { app: 'Genre_des_noms', version: 2, exported: new Date().toISOString(), progress: data.progress, lists: data.lists, settings: data.settings };
  var blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Sauvegarde_Genre_' + today() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Sauvegarde exportée.');
}
function importSave(file) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var obj = JSON.parse(rd.result);
      if (!obj || obj.app !== 'Genre_des_noms' || typeof obj.progress !== 'object') throw new Error('format');
      openModal('Importer une sauvegarde',
        '<p>Cette sauvegarde du ' + esc(String(obj.exported || '').slice(0, 10)) + ' remplacera la progression actuelle.</p>',
        '<button class="btn-sub" id="mCancel">Annuler</button><button class="btn-main" id="mOk">Remplacer</button>');
      $('mCancel').onclick = closeModal;
      $('mOk').onclick = function () { adopt(obj); save(); closeModal(); renderHome(); toast('Sauvegarde importée.'); };
    } catch (e) { toast('Fichier non reconnu : choisissez une sauvegarde exportée par cette application.'); }
  };
  rd.readAsText(file);
}
function confirmReset() {
  openModal('Réinitialiser la progression',
    '<p>Toute la progression des cinq modes sera effacée. Les listes importées sont conservées. Exportez d’abord une sauvegarde si vous voulez pouvoir revenir en arrière.</p>',
    '<button class="btn-sub" id="mCancel">Annuler</button><button class="btn-main btn-danger" id="mOk">Effacer</button>');
  $('mCancel').onclick = closeModal;
  $('mOk').onclick = function () { data.progress = {}; save(); closeModal(); renderHome(); toast('Progression effacée.'); };
}

// ═══════════════════════════════════
// LISTES IMPORTÉES
// ═══════════════════════════════════
function genderOf(de) {
  var s = String(de).trim();
  var plural = /\((pluriel|pl\.?)\)/i.test(s);
  var m = s.match(/^((?:der|die|das)(?:\s*\/\s*(?:der|die|das))?)\s+(.+)$/i);
  if (!m) return null;
  var arts = m[1].toLowerCase().replace(/\s/g, '').split('/');
  var noun = m[2].replace(/\s*\((pluriel|pl\.?)\)\s*/ig, ' ').trim();
  var g;
  if (arts.length === 1) g = arts[0] === 'die' && plural ? 'pl' : arts[0];
  else {
    var order = { der: 0, das: 1, die: 2 };
    arts.sort(function (a, b) { return order[a] - order[b]; });
    g = arts[0] === arts[1] ? arts[0] : arts.join('');
  }
  return { g: g, noun: noun };
}
function splitLine(t) {
  var seps = [/\s+–\s+/, /\s+—\s+/, /\s+-\s+/];
  for (var i = 0; i < seps.length; i++) {
    var m = t.match(seps[i]);
    if (m) return [t.slice(0, m.index).trim(), t.slice(m.index + m[0].length).trim()];
  }
  return null;
}
function parseFile(fileName, text) {
  var m = fileName.match(/^(Vocabulaire|Genre)_(.+)\.txt$/i);
  if (!m) return { error: 'nom non reconnu (attendu : Genre_<Nom>.txt ou Vocabulaire_<Nom>.txt)' };
  var type = m[1].toLowerCase() === 'genre' ? 'G' : 'V';
  var name = m[2].replace(/_/g, ' ').trim();
  var lines = String(text).replace(/^\uFEFF/, '').split(/\r?\n/);
  var entries = [], seen = {}, skipped = [], ignored = 0, dup = 0;
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (!t) continue;
    var parts = splitLine(t);
    var gi = parts && parts[0] ? genderOf(parts[0]) : null;
    if (!gi) {
      if (type === 'V') ignored++;   // listes de vocabulaire : seuls les noms avec article sont retenus
      else skipped.push((i + 1) + ' : ' + t + (parts ? ' (article der/die/das absent)' : ' (séparateur « – » absent)'));
      continue;
    }
    if (!parts[1]) { skipped.push((i + 1) + ' : ' + t + ' (traduction absente)'); continue; }
    if (seen[parts[0]]) { dup++; continue; }
    seen[parts[0]] = true;
    entries.push({ de: parts[0], fr: parts[1] });
  }
  return { type: type, name: name, entries: entries, skipped: skipped, ignored: ignored, dup: dup };
}
function listId(type, name) { return type + ':' + name.toLowerCase(); }
function importFiles(files) {
  var txt = [], json = null;
  Array.prototype.forEach.call(files, function (f) {
    if (/\.json$/i.test(f.name)) json = f; else txt.push(f);
  });
  if (json && !txt.length) { importSave(json); return; }
  if (!txt.length) { toast('Aucun fichier .txt reconnu.'); return; }
  var reports = [], left = txt.length;
  txt.forEach(function (f) {
    var rd = new FileReader();
    rd.onload = function () { reports.push(applyFile(f.name, rd.result)); if (!--left) showImportReport(reports); };
    rd.onerror = function () { reports.push({ file: f.name, error: 'lecture impossible' }); if (!--left) showImportReport(reports); };
    rd.readAsText(f, 'UTF-8');
  });
}
function applyFile(fileName, text) {
  var r = parseFile(fileName, text);
  if (r.error) return { file: fileName, error: r.error };
  if (!r.entries.length) return { file: fileName, error: 'aucun nom avec article der/die/das trouvé' };
  var id = listId(r.type, r.name), existed = !!data.lists[id];
  data.lists[id] = { id: id, name: r.name, type: r.type, file: fileName, imported: today(), entries: r.entries };
  delete data.settings.deselected[id];
  save();
  return { file: fileName, name: r.name, n: r.entries.length, existed: existed, skipped: r.skipped, ignored: r.ignored, dup: r.dup };
}
function showImportReport(reports) {
  var h = reports.map(function (r) {
    if (r.error) return '<div class="rep-file"><b>' + esc(r.file) + '</b><br><span class="v-ko">Non importé : ' + esc(r.error) + '</span></div>';
    var t = '<div class="rep-file"><b>' + esc(r.name) + '</b> : ' + r.n + ' nom(s) ' + (r.existed ? '(liste mise à jour, progression conservée)' : '(nouvelle liste)');
    if (r.ignored) t += '<br><span class="rep-skip">' + r.ignored + ' ligne(s) sans article ignorée(s) (mots autres que des noms).</span>';
    if (r.dup) t += '<br><span class="rep-skip">' + r.dup + ' doublon(s) ignoré(s).</span>';
    if (r.skipped.length) t += '<br><span class="rep-skip">' + r.skipped.length + ' ligne(s) rejetée(s) :<br>' + r.skipped.slice(0, 12).map(esc).join('<br>') + (r.skipped.length > 12 ? '<br>…' : '') + '</span>';
    return t + '</div>';
  }).join('');
  openModal('Importation', h, '<button class="btn-main" id="mOk">OK</button>');
  $('mOk').onclick = closeModal;
  data.settings.mode = 'imp'; save(); renderHome();
}
function renderLists() {
  var lists = sortedLists(), box = $('srcList'), t = today();
  if (!lists.length) {
    box.innerHTML = '<div class="empty">Aucune liste importée.<br>Importez un fichier <code>Genre_&lt;Nom&gt;.txt</code> ou <code>Vocabulaire_&lt;Nom&gt;.txt</code> : une ligne par mot, par exemple « der Hund – chien ». Dans les fichiers Vocabulaire, seules les lignes commençant par der, die ou das sont retenues.</div>';
    return;
  }
  box.innerHTML = lists.map(function (L) {
    var sel = !data.settings.deselected[L.id], due = 0, fresh = 0, mast = 0;
    L.entries.forEach(function (e) {
      var p = data.progress[pkey('imp', e.de)];
      if (!p) fresh++; else { if (p.due <= t) due++; if (isMastered(p)) mast++; }
    });
    return '<div class="src-card' + (sel ? ' sel' : '') + '" data-id="' + esc(L.id) + '" tabindex="0" role="checkbox" aria-checked="' + sel + '">' +
      '<div class="src-head"><span class="check">✓</span><span class="src-name">' + esc(L.name) + '</span>' +
      '<span class="src-type">' + (L.type === 'G' ? 'Genre' : 'Vocabulaire') + '</span>' +
      '<button class="src-del" data-del="' + esc(L.id) + '" title="Supprimer la liste" aria-label="Supprimer la liste">×</button></div>' +
      '<div class="src-meta">' + L.entries.length + ' noms · ' + due + ' à réviser · ' + fresh + ' nouveaux · ' + mast + ' maîtrisés</div></div>';
  }).join('');
}
function deleteList(id) {
  var L = data.lists[id]; if (!L) return;
  openModal('Supprimer la liste',
    '<p>La liste « ' + esc(L.name) + ' » sera supprimée. La progression des mots qui ne figurent dans aucune autre liste sera effacée.</p>',
    '<button class="btn-sub" id="mCancel">Annuler</button><button class="btn-main btn-danger" id="mOk">Supprimer</button>');
  $('mCancel').onclick = closeModal;
  $('mOk').onclick = function () {
    delete data.lists[id]; delete data.settings.deselected[id];
    var keep = {};
    Object.keys(data.lists).forEach(function (k) { data.lists[k].entries.forEach(function (e) { keep[e.de] = true; }); });
    L.entries.forEach(function (e) { if (!keep[e.de]) delete data.progress[pkey('imp', e.de)]; });
    save(); closeModal(); renderHome(); toast('Liste supprimée.');
  };
}

// ═══════════════════════════════════
// ÉVÉNEMENTS
// ═══════════════════════════════════
$('modeToggle').addEventListener('click', function (e) {
  var b = e.target.closest('.mode-btn'); if (b) setMode(b.getAttribute('data-mode'));
});
$('gramCheck').addEventListener('change', function () { data.settings.gram = this.checked; save(); renderHome(); });
$('limitInput').addEventListener('change', function () {
  var v = parseInt(this.value, 10);
  if (!(v > 0)) v = MODES[data.settings.mode].def;
  data.settings.limits[data.settings.mode] = Math.min(500, v); save(); renderHome();
});
$('reviewBtn').addEventListener('click', function () { startSession('review'); });
$('newBtn').addEventListener('click', function () { startSession('new'); });
$('refBtn').addEventListener('click', openReference);
$('exportBtn').addEventListener('click', exportSave);
$('importBtn').addEventListener('click', function () { $('saveInput').value = ''; $('saveInput').click(); });
$('saveInput').addEventListener('change', function () { if (this.files[0]) importSave(this.files[0]); });
$('resetBtn').addEventListener('click', confirmReset);
$('importListBtn').addEventListener('click', function () { $('fileInput').value = ''; $('fileInput').click(); });
$('fileInput').addEventListener('change', function () { if (this.files.length) importFiles(this.files); });
$('srcList').addEventListener('click', function (e) {
  var del = e.target.closest('.src-del');
  if (del) { e.stopPropagation(); deleteList(del.getAttribute('data-del')); return; }
  var c = e.target.closest('.src-card'); if (!c) return;
  var id = c.getAttribute('data-id');
  if (data.settings.deselected[id]) delete data.settings.deselected[id]; else data.settings.deselected[id] = true;
  save(); renderHome();
});
$('srcList').addEventListener('keydown', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('src-card')) { e.preventDefault(); e.target.click(); }
});
// Glisser-déposer
var dragDepth = 0;
function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
document.addEventListener('dragenter', function (e) { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('dropOverlay').classList.add('show'); });
document.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('dragleave', function (e) { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('dropOverlay').classList.remove('show'); } });
document.addEventListener('drop', function (e) {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('dropOverlay').classList.remove('show');
  if ($('screenHome').classList.contains('active')) importFiles(e.dataTransfer.files);
  else toast('Revenez à l’accueil pour importer des fichiers.');
});
$('backBtn').addEventListener('click', function () {
  if (session && session.mode === 'mrg' && session.done > 0 && session.queue.length) {
    toast('Séance interrompue : les règles non terminées ne sont pas notées.');
  }
  goHome();
});
$('backBtn2').addEventListener('click', goHome);
$('againBtn').addEventListener('click', function () { var k = session ? session.kind : 'review'; goHome(); startSession(k); });
$('nextBtn').addEventListener('click', function () { if (phase === 'next') nextItem(); });
$('btnsGender').addEventListener('click', onGenderClick);
$('btnsCombo').addEventListener('click', onGenderClick);
function onGenderClick(e) {
  var b = e.target.closest('.gender-btn');
  if (!b || b.disabled || phase !== 'gender' || !cur || !cur.answer) return;
  phase = 'busy';
  cur.answer(b.getAttribute('data-g'));
}
$('optList').addEventListener('click', function (e) {
  var b = e.target.closest('.opt-btn');
  if (!b || b.disabled || phase !== 'opt' || !cur || !cur.choose) return;
  phase = 'busy';
  cur.choose(b.getAttribute('data-k'));
});
$('modalClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

document.addEventListener('keydown', function (e) {
  if ($('modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
  if (!$('screenCard').classList.contains('active') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { goHome(); return; }
  var n = parseInt(e.key, 10);
  if (phase === 'gender' && n >= 1 && n <= 7) {
    var btn = document.querySelectorAll('#btnsGender .gender-btn, #btnsCombo .gender-btn')[n - 1];
    if (btn && btn.offsetParent !== null) { e.preventDefault(); btn.click(); }
  } else if (phase === 'opt' && n >= 1 && n <= 4) {
    var ob = document.querySelectorAll('#optList .opt-btn')[n - 1];
    if (ob) { e.preventDefault(); ob.click(); }
  } else if (phase === 'next' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); nextItem();
  } else if (phase === 'done' && e.key === 'Enter') {
    e.preventDefault(); $('againBtn').click();
  }
});

// ═══════════════════════════════════
// DÉMARRAGE
// ═══════════════════════════════════
load();
renderHome();
