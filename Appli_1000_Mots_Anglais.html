<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1000 Mots Anglais — Vocabulaire & Prononciation</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f1923;
    color: #e8e6e3;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }
  html { height: -webkit-fill-available; overflow: hidden; }

  /* ── SCREENS ── */
  .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .screen.active { display: flex; align-items: center; justify-content: center; }

  /* ── GROUP SELECT ── */
  .group-select {
    flex-direction: column;
    padding: 1rem;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    align-items: center;
    justify-content: flex-start !important;
    padding-top: 2rem;
  }
  .group-select h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #8a9bb5;
    margin-bottom: 0.3rem;
    flex-shrink: 0;
  }
  .group-select .subtitle {
    font-size: 0.82rem;
    color: #4e5d73;
    margin-bottom: 1.2rem;
    flex-shrink: 0;
  }
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    max-width: 380px;
    width: 100%;
    padding-bottom: 2rem;
    flex-shrink: 0;
  }
  @media (min-width: 640px) {
    .groups-grid { grid-template-columns: repeat(3, 1fr); max-width: 720px; }
  }
  @media (min-width: 1000px) {
    .groups-grid { grid-template-columns: repeat(4, 1fr); max-width: 960px; }
  }
  .group-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 8px;
    min-height: 62px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    color: #7a8ea6;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    line-height: 1.3;
    touch-action: manipulation;
  }
  .group-btn:active { transform: scale(0.93); }
  .group-btn .gname {
    font-size: 0.82rem; font-weight: 600; color: #b0c4de; display: block;
    hyphens: auto; overflow-wrap: break-word;
  }
  .group-btn .gcount { font-size: 0.62rem; color: #4e5d73; display: block; margin-top: 3px; }
  .group-btn.completed { border-color: #2a6e4e; background: rgba(42,110,78,0.15); }
  .group-btn.completed .gname { color: #5bbd8a; }
  .group-btn.in-progress { border-color: #5a5030; background: rgba(90,80,48,0.15); }
  .group-btn.in-progress .gname { color: #d4b85a; }

  .grid-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    width: 100%;
    max-width: 380px;
    margin-bottom: 0.9rem;
    flex-shrink: 0;
  }
  @media (min-width: 640px) { .grid-head { max-width: 720px; } }
  @media (min-width: 1000px) { .grid-head { max-width: 960px; } }
  .grid-head-title { font-size: 0.95rem; color: #b0c4de; }
  .group-btn .gsub { font-size: 0.62rem; color: #3d4f66; display: block; margin-top: 2px; }
  .mode-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1.2rem;
    flex-shrink: 0;
  }
  .mode-tab {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    color: #7a8ea6;
    font-size: 0.82rem;
    padding: 8px 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .mode-tab.active {
    border-color: #3a6fa0;
    background: rgba(58,111,160,0.22);
    color: #cfe0f2;
  }

  /* ── LESSON LIST ── */
  .lesson-screen {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start !important;
    padding: 1rem;
    padding-top: 1.4rem;
  }
  .lesson-head {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.9rem;
    flex-shrink: 0;
  }
  .lesson-title { font-size: 1.15rem; color: #6cb4ee; font-weight: 400; }
  .lesson-title span { font-size: 0.78rem; color: #4e5d73; margin-left: 0.5rem; }
  .lesson-list {
    width: 100%;
    max-width: 640px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2rem;
    flex: 1 1 auto;
  }
  .lrow {
    display: grid;
    grid-template-columns: minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.1fr);
    gap: 4px 10px;
    align-items: baseline;
    padding: 9px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .lrow .lw { font-size: 1rem; font-weight: 600; color: #e8e6e3; overflow-wrap: break-word; }
  .lrow .li { font-size: 0.95rem; color: #6cb4ee; overflow-wrap: break-word; }
  .lrow .lf { font-size: 0.9rem; color: #d4b85a; overflow-wrap: break-word; }
  .lrow .ln {
    grid-column: 1 / -1;
    font-size: 0.75rem;
    font-style: italic;
    color: #7e8fa5;
    line-height: 1.4;
  }
  @media (max-width: 430px) {
    .lrow { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .lrow .lf { grid-column: 1 / -1; }
  }

  /* ── CARD SCREEN ── */
  .card-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    margin-bottom: 0.6rem;
  }
  .back-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #7a8ea6;
    font-size: 0.82rem;
    padding: 6px 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .back-btn:active { opacity: 0.6; }
  .group-label {
    font-size: 0.82rem;
    color: #4e5d73;
    text-align: right;
    margin-left: 0.8rem;
  }
  .progress-track {
    width: 100%;
    max-width: 440px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-bottom: 1.4rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3a8f6a, #5bbd8a);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0;
  }

  /* ── THE CARD ── */
  .card {
    width: 100%;
    max-width: 440px;
    min-height: 260px;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    margin-bottom: 1.2rem;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(ellipse at 30% 20%, rgba(90,160,230,0.06), transparent 60%);
    pointer-events: none;
  }
  .word-rank {
    font-size: 0.72rem;
    color: #3d4f66;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }
  .word-en {
    font-size: 2.8rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
    text-align: center;
    line-height: 1.15;
  }
  .word-ipa {
    font-size: 1.5rem;
    color: #6cb4ee;
    font-weight: 300;
    margin-bottom: 0.5rem;
    min-height: 2.2rem;
    text-align: center;
  }
  .word-fr {
    font-size: 1.15rem;
    color: #d4b85a;
    font-weight: 400;
    min-height: 1.6rem;
    text-align: center;
  }
  .word-note {
    font-size: 0.78rem;
    color: #7e8fa5;
    font-style: italic;
    margin-top: 0.6rem;
    min-height: 1rem;
    text-align: center;
    line-height: 1.45;
    max-width: 22rem;
  }

  /* ── AUDIO ── */
  .audio-zone {
    margin-top: 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    min-height: 3.6rem;
  }
  .audio-zone.hidden { visibility: hidden; }
  .play-btn {
    background: rgba(108,180,238,0.12);
    border: 1px solid rgba(108,180,238,0.35);
    color: #cfe0f2;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    min-width: 0;
  }
  .play-btn.playing { background: rgba(108,180,238,0.28); border-color: #6cb4ee; }
  .play-btn:disabled { background: none; border-color: rgba(255,255,255,0.08); color: #4e5d73; opacity: 1; }
  .play-btn:focus-visible, .lplay:focus-visible { outline: 2px solid #6cb4ee; outline-offset: 2px; }
  .audio-credit {
    font-size: 0.66rem;
    color: #4e5d73;
    text-align: center;
    line-height: 1.4;
    max-width: 22rem;
    -webkit-user-select: text;
    user-select: text;
  }
  .audio-credit a { color: #6a7f9a; }
  .audio-credit .audio-err { color: #d4943a; display: block; }
  .lrow .lw { display: flex; align-items: baseline; gap: 8px; }
  .lplay {
    flex-shrink: 0;
    width: 28px; height: 28px;
    padding: 0;
    border-radius: 50%;
    background: rgba(108,180,238,0.12);
    border: 1px solid rgba(108,180,238,0.35);
    color: #cfe0f2;
    font-size: 0.7rem;
    font-weight: 400;
    align-self: center;
  }
  .lplay.playing { background: rgba(108,180,238,0.3); border-color: #6cb4ee; }
  .lplay.failed { border-color: #d4943a; color: #d4943a; }
  .lplay:disabled { background: none; border-color: rgba(255,255,255,0.06); color: #3d4f66; opacity: 1; }
  .lrow .lc {
    grid-column: 1 / -1;
    font-size: 0.64rem;
    color: #4e5d73;
    line-height: 1.4;
    -webkit-user-select: text;
    user-select: text;
  }
  .lrow .lc a { color: #6a7f9a; }
  .lrow .lc .audio-err { color: #d4943a; }

  /* ── BUTTONS ── */
  .buttons-zone {
    height: 5.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.4rem;
    position: relative;
    width: 100%;
    max-width: 440px;
  }
  .buttons {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    position: absolute;
  }
  .buttons.hidden { visibility: hidden; pointer-events: none; }
  button {
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active:not(:disabled) { transform: scale(0.95); opacity: 0.85; }
  button:disabled { cursor: default; opacity: 0.35; }
  .btn-reveal {
    background: linear-gradient(135deg, #3a6fa0, #2a5080);
    color: white;
    min-width: 200px;
    box-shadow: 0 4px 20px rgba(42,80,128,0.4);
  }
  /* Boutons de réponse : « Connu » à gauche, séparé des trois délais de révision */
  .buttons.answer { gap: 1.6rem; }
  .review-set { display: flex; gap: 0.5rem; }
  .btn-sq {
    width: 4.8rem;
    height: 4.8rem;
    padding: 0;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.15rem;
    color: #15202b;
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.1;
  }
  .btn-sq .ic { font-size: 1.25rem; font-weight: 700; }
  .btn-sq:focus-visible { outline: 2px solid #e8e6e3; outline-offset: 3px; }
  .btn-known {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    box-shadow: 0 4px 15px rgba(56,220,160,0.3);
  }
  .btn-r3 {
    background: linear-gradient(135deg, #ff6f91, #ffd36e);
    box-shadow: 0 4px 15px rgba(255,140,130,0.28);
  }
  .btn-r5 {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    box-shadow: 0 4px 15px rgba(247,160,30,0.28);
  }
  .btn-r20 {
    background: linear-gradient(135deg, #e53945, #f5576c);
    box-shadow: 0 4px 15px rgba(229,57,69,0.3);
  }
  .btn-restart {
    background: linear-gradient(135deg, #3a6fa0, #2a5080);
    color: white;
    min-width: 200px;
  }

  .stats {
    font-size: 0.74rem;
    color: #3d4f66;
    line-height: 1.8;
    text-align: center;
  }
  .stats strong { color: #6a7f9a; }
  .stats .st { white-space: nowrap; }

  /* ── DONE ── */
  .done-box {
    text-align: center;
    padding: 2rem;
  }
  .done-box h2 {
    font-size: 1.8rem;
    font-weight: 300;
    color: #5bbd8a;
    margin-bottom: 1rem;
  }
  .done-box p {
    color: #5a6f88;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  @media (max-width: 370px) {
    .word-en { font-size: 2.2rem; }
    .word-ipa { font-size: 1.25rem; }
    .groups-grid { grid-template-columns: repeat(4, 1fr); }
    button { padding: 12px 18px; font-size: 0.88rem; }
    .btn-sq { width: 4.4rem; height: 4.4rem; padding: 0; font-size: 1rem; }
    .buttons.answer { gap: 1rem; }
    .review-set { gap: 0.4rem; }
  }
  @media (max-height: 650px) {
    .card { min-height: 200px; padding: 1.2rem; }
    .audio-zone { margin-top: 0.5rem; }
    .buttons-zone { height: 4.8rem; }
    .btn-sq { width: 4.4rem; height: 4.4rem; }
    .word-en { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<!-- ═══ SCREEN 1: GROUP SELECT ═══ -->
<div class="screen group-select active" id="screenGroups">
  <h1>🔤 1000 Mots Anglais</h1>
  <div class="subtitle" id="subtitle">Prononciation API · General American</div>
  <div class="mode-tabs">
    <div class="mode-tab active" id="tabCards">Mode flashcards</div>
    <div class="mode-tab" id="tabLessons">Mode leçon</div>
  </div>
  <div class="grid-head" id="gridHead" style="display:none">
    <button class="back-btn" id="gridBackBtn">← Catégories</button>
    <span class="grid-head-title" id="gridHeadTitle"></span>
  </div>
  <div class="groups-grid" id="groupsGrid"></div>
  <div class="groups-grid" id="lessonsGrid" style="display:none"></div>
</div>

<!-- ═══ SCREEN 3: LESSON LIST ═══ -->
<div class="screen lesson-screen" id="screenLesson">
  <div class="lesson-head">
    <button class="back-btn" id="backBtn3">← Leçons</button>
    <div class="lesson-title" id="lessonTitle"></div>
  </div>
  <div class="lesson-list" id="lessonList"></div>
</div>

<!-- ═══ SCREEN 2: FLASHCARD ═══ -->
<div class="screen card-screen" id="screenCard">
  <div class="top-bar">
    <button class="back-btn" id="backBtn">← Groupes</button>
    <span class="group-label" id="groupLabel">Groupe 1</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="theCard">
    <div class="word-rank" id="wordRank">#1</div>
    <div class="word-en" id="wordEn">&nbsp;</div>
    <div class="word-ipa" id="wordIpa">&nbsp;</div>
    <div class="word-fr" id="wordFr">&nbsp;</div>
    <div class="word-note" id="wordNote">&nbsp;</div>
    <div class="audio-zone hidden" id="audioZone">
      <button class="play-btn" id="playBtn" type="button">▶ Écouter</button>
      <div class="audio-credit" id="audioCredit"></div>
    </div>
  </div>

  <div class="buttons-zone">
    <div class="buttons" id="revealButtons">
      <button class="btn-reveal" id="revealBtn">Révéler</button>
    </div>
    <div class="buttons answer hidden" id="actionButtons">
      <button class="btn-sq btn-known" id="knownBtn" type="button" aria-label="Connu"><span class="ic">✓</span>Connu</button>
      <div class="review-set">
        <button class="btn-sq btn-r3" id="review3Btn" type="button" aria-label="À revoir dans 3 tours">+3</button>
        <button class="btn-sq btn-r5" id="review5Btn" type="button" aria-label="À revoir dans 5 tours">+5</button>
        <button class="btn-sq btn-r20" id="review20Btn" type="button" aria-label="À revoir dans 20 tours">+20</button>
      </div>
    </div>

  <div class="stats" id="stats"></div>

  <div class="done-box" id="doneBox" style="display:none">
    <h2>✓ Groupe terminé !</h2>
    <p id="doneSummary">Tous les mots sont maîtrisés.</p>
    <button class="btn-restart" id="restartBtn">Recommencer ce groupe</button>
    <br><br>
    <button class="back-btn" id="backBtn2">← Retour aux groupes</button>
  </div>
</div>

<script src="Liste_1000_Mots_Anglais.js"></script>
<script src="Audio_1000_Mots_Anglais.js"></script>
<script>
if (typeof W === 'undefined' || typeof G === 'undefined') {
  document.getElementById('groupsGrid').outerHTML =
    '<p style="max-width:22rem;text-align:center">Le fichier Liste_1000_Mots_Anglais.js est introuvable. Placez-le dans le même dossier que cette page.</p>';
  throw new Error('Liste_1000_Mots_Anglais.js manquant');
}

// ═══════════════════════════════════
// AUDIO (Wikimedia Commons)
// ═══════════════════════════════════
// AU vient de Audio_1000_Mots_Anglais.js. Si ce fichier manque, l'application
// fonctionne sans le son.
var HAS_AUDIO_FILE = (typeof AU !== 'undefined');
if (!HAS_AUDIO_FILE) var AU = {};
var COMMONS = 'https://upload.wikimedia.org/wikipedia/commons/';
var LICENSE_URL = {
  'CC BY-SA 3.0': 'https://creativecommons.org/licenses/by-sa/3.0/',
  'CC BY-SA 4.0': 'https://creativecommons.org/licenses/by-sa/4.0/',
  'CC BY 3.0': 'https://creativecommons.org/licenses/by/3.0/',
  'CC BY 4.0': 'https://creativecommons.org/licenses/by/4.0/',
  'CC0': 'https://creativecommons.org/publicdomain/zero/1.0/'
};
var AUDIO_FAIL_MSG = 'Lecture impossible : connexion absente ou fichier retiré de Wikimedia Commons.';
var AUDIO_BLOCKED_MSG = 'Le navigateur a bloqué la lecture. Touchez de nouveau le bouton.';

function audioEntry(word) {
  return Object.prototype.hasOwnProperty.call(AU, word) ? AU[word] : null;
}

function audioSources(e) {
  var path = e[0];
  var name = path.split('/').pop();
  var srcs = [COMMONS + 'transcoded/' + path + '/' + name + '.mp3'];
  var probe = document.createElement('audio');
  if (probe.canPlayType && probe.canPlayType('audio/ogg') !== '') srcs.push(COMMONS + path);
  return srcs;
}

// Remplit el avec le crédit : auteur (lien vers la page Commons) et licence.
function fillCredit(el, e) {
  el.innerHTML = '';
  if (!e) return;
  var name = e[0].split('/').pop();
  el.appendChild(document.createTextNode('Enregistrement : '));
  var a1 = document.createElement('a');
  a1.href = 'https://commons.wikimedia.org/wiki/File:' + name;
  a1.target = '_blank'; a1.rel = 'noopener';
  a1.textContent = e[1];
  el.appendChild(a1);
  el.appendChild(document.createTextNode(', '));
  if (LICENSE_URL[e[2]]) {
    var a2 = document.createElement('a');
    a2.href = LICENSE_URL[e[2]];
    a2.target = '_blank'; a2.rel = 'noopener';
    a2.textContent = e[2];
    el.appendChild(a2);
  } else {
    el.appendChild(document.createTextNode(e[2] === 'Public domain' ? 'domaine public' : e[2]));
  }
  el.appendChild(document.createTextNode(', Wikimedia Commons'));
  if (e[3]) {
    var n = document.createElement('span');
    n.style.display = 'block';
    n.textContent = 'Prononciation enregistrée : ' + e[3] + '.';
    el.appendChild(n);
  }
}

function showAudioError(creditEl, msg) {
  var old = creditEl.querySelector('.audio-err');
  if (old) old.parentNode.removeChild(old);
  if (!msg) return;
  var s = document.createElement('span');
  s.className = 'audio-err';
  s.textContent = ' ' + msg;
  creditEl.appendChild(s);
}

var player = new Audio();
player.preload = 'none';
var playToken = 0;
var playBtnEl = null;   // bouton du son en cours
var playCreditEl = null;

function resetPlayState() {
  if (playBtnEl) playBtnEl.classList.remove('playing');
  playBtnEl = null;
  playCreditEl = null;
}

function stopAudio() {
  playToken++;
  try { player.pause(); } catch (err) {}
  resetPlayState();
}

// Joue le mot. La lecture essaie d'abord le MP3 transcodé, puis l'original Ogg.
function playWord(word, btn, creditEl) {
  var e = audioEntry(word);
  if (!e) return;
  stopAudio();
  var token = playToken;
  var srcs = audioSources(e);
  var i = 0;
  playBtnEl = btn; playCreditEl = creditEl;
  btn.classList.add('playing');
  btn.classList.remove('failed');
  showAudioError(creditEl, '');

  function fail(msg) {
    if (token !== playToken) return;
    btn.classList.add('failed');
    showAudioError(creditEl, msg);
    resetPlayState();
  }
  function tryNext() {
    if (token !== playToken) return;
    if (i >= srcs.length) { fail(AUDIO_FAIL_MSG); return; }
    var attempt = ++i;
    player.onerror = function() {
      if (token === playToken && attempt === i) tryNext();
    };
    player.onended = function() {
      if (token === playToken) resetPlayState();
    };
    player.src = srcs[attempt - 1];
    var pr;
    try { pr = player.play(); } catch (err) { tryNext(); return; }
    if (pr && pr.catch) {
      pr.catch(function(err) {
        if (token !== playToken || attempt !== i) return;
        if (err && err.name === 'NotAllowedError') fail(AUDIO_BLOCKED_MSG);
        else if (err && err.name === 'AbortError') return;
        else tryNext();
      });
    }
  }
  tryNext();
}

// ═══════════════════════════════════
// APP STATE
// ═══════════════════════════════════
var NGROUPS = G.length;
var GSTART = [];
(function() {
  var s = 0;
  for (var i = 0; i < G.length; i++) { GSTART.push(s); s += G[i][1]; }
})();
var currentGroup = -1;
var groupWords = [];
var available = [];
var reviewQueue = [];
var known = [];
var turn = 0;
var current = null;
var revealed = false;

// Load progress from memory
var progress = {};
try {
  var saved = localStorage.getItem('eng1000_progress_v4');
  if (saved) progress = JSON.parse(saved);
} catch(e) {}

function saveProgress() {
  try {
    progress[currentGroup] = { known: known.length, total: groupWords.length };
    localStorage.setItem('eng1000_progress_v4', JSON.stringify(progress));
  } catch(e) {}
}

// ═══════════════════════════════════
// GROUP SELECT
// ═══════════════════════════════════
var currentParent = null;

function groupLabel(g) {
  return G[g][2] ? G[g][2] + ' — ' + G[g][0] : G[g][0];
}

function childrenOf(parent) {
  var out = [];
  for (var g = 0; g < NGROUPS; g++) if (G[g][2] === parent) out.push(g);
  return out;
}

function makeBtn(grid, title, sub, count, state, fn) {
  var btn = document.createElement('div');
  btn.className = 'group-btn' + (state ? ' ' + state : '');
  btn.innerHTML = '<span class="gname"></span><span class="gcount">' + count + ' mots</span>' +
                  (sub ? '<span class="gsub"></span>' : '');
  btn.querySelector('.gname').textContent = title;
  if (sub) btn.querySelector('.gsub').textContent = sub;
  btn.addEventListener('click', fn);
  btn.addEventListener('touchstart', function(e) { e.preventDefault(); fn(); }, {passive:false});
  grid.appendChild(btn);
  return btn;
}

function groupState(g) {
  var p = progress[g];
  if (p && p.known >= p.total) return 'completed';
  if (p && p.known > 0) return 'in-progress';
  return '';
}

function buildGroupGrid() {
  currentParent = null;
  document.getElementById('gridHead').style.display = 'none';
  var grid = document.getElementById('groupsGrid');
  grid.innerHTML = '';
  var seen = {};
  for (var g = 0; g < NGROUPS; g++) {
    var parent = G[g][2];
    if (!parent) {
      (function(gg) {
        makeBtn(grid, G[gg][0], '', G[gg][1], groupState(gg), function() { startGroup(gg); });
      })(g);
    } else if (!seen[parent]) {
      seen[parent] = true;
      (function(pp) {
        var kids = childrenOf(pp), total = 0, known = 0, doneParts = 0;
        for (var k = 0; k < kids.length; k++) {
          total += G[kids[k]][1];
          var pr = progress[kids[k]];
          if (pr) { known += pr.known; if (pr.known >= pr.total) doneParts++; }
        }
        var state = doneParts === kids.length ? 'completed' : (known > 0 ? 'in-progress' : '');
        var sub = kids.length + ' parties' +
                  (known > 0 ? ' · ' + known + (known > 1 ? ' connus' : ' connu') : '');
        makeBtn(grid, pp, sub, total, state, function() { openParent(pp); });
      })(parent);
    }
  }
}

function openParent(parent) {
  currentParent = parent;
  document.getElementById('gridHead').style.display = 'flex';
  document.getElementById('gridHeadTitle').textContent = parent;
  var grid = document.getElementById('groupsGrid');
  grid.innerHTML = '';
  var kids = childrenOf(parent);
  for (var k = 0; k < kids.length; k++) {
    (function(gg) {
      makeBtn(grid, G[gg][0], '', G[gg][1], groupState(gg), function() { startGroup(gg); });
    })(kids[k]);
  }
}

function refreshGrid() {
  if (currentParent) openParent(currentParent); else buildGroupGrid();
}

function startGroup(g) {
  currentGroup = g;
  currentParent = G[g][2] || null;
  var start = GSTART[g];
  var end = start + G[g][1];
  groupWords = [];
  for (var i = start; i < end; i++) {
    groupWords.push({ rank: W[i][4], word: W[i][0], ipa: W[i][1], fr: W[i][2], note: W[i][3] });
  }
  available = groupWords.slice();
  reviewQueue = [];
  known = [];
  turn = 0;
  revealed = false;

  document.getElementById('groupLabel').textContent = groupLabel(g);
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('theCard').style.display = '';
  document.querySelector('.buttons-zone').style.display = '';
  document.getElementById('stats').style.display = '';

  document.getElementById('screenGroups').classList.remove('active');
  document.getElementById('screenCard').classList.add('active');
  showWord();
}

function goBack() {
  stopAudio();
  saveProgress();
  document.getElementById('screenCard').classList.remove('active');
  document.getElementById('screenGroups').classList.add('active');
  refreshGrid();
}

// ═══════════════════════════════════
// FLASHCARD LOGIC
// ═══════════════════════════════════
function pickNext() {
  var i, pick;
  var due = [];
  for (i = 0; i < reviewQueue.length; i++) {
    if (reviewQueue[i].showAtTurn <= turn) due.push(reviewQueue[i]);
  }
  if (due.length > 0) {
    pick = due[Math.floor(Math.random() * due.length)];
    reviewQueue = reviewQueue.filter(function(r) { return r !== pick; });
    return pick.w;
  }
  if (available.length > 0) {
    return available[Math.floor(Math.random() * available.length)];
  }
  if (reviewQueue.length > 0) {
    reviewQueue.sort(function(a, b) { return a.showAtTurn - b.showAtTurn; });
    pick = reviewQueue[0];
    reviewQueue = reviewQueue.slice(1);
    return pick.w;
  }
  return null;
}

function showWord() {
  current = pickNext();
  if (!current) {
    document.getElementById('theCard').style.display = 'none';
    document.querySelector('.buttons-zone').style.display = 'none';
    document.getElementById('stats').style.display = 'none';
    document.getElementById('doneBox').style.display = 'block';
    document.getElementById('doneSummary').textContent =
      'Vous avez maîtrisé les ' + groupWords.length + ' mots de ce groupe !';
    saveProgress();
    return;
  }
  revealed = false;
  document.getElementById('wordRank').textContent = 'fréquence #' + current.rank;
  document.getElementById('wordEn').textContent = current.word;
  document.getElementById('wordIpa').innerHTML = '&nbsp;';
  document.getElementById('wordFr').innerHTML = '&nbsp;';
  document.getElementById('wordNote').innerHTML = '&nbsp;';
  stopAudio();
  setupCardAudio(current.word);
  document.getElementById('revealBtn').disabled = false;
  document.getElementById('revealButtons').classList.remove('hidden');
  document.getElementById('actionButtons').classList.add('hidden');
  updateStats();
}

function doReveal() {
  if (!current || revealed) return;
  revealed = true;
  turn++;
  document.getElementById('wordIpa').textContent = '[' + current.ipa + ']';
  document.getElementById('wordFr').textContent = current.fr;
  document.getElementById('wordNote').textContent = current.note || '';
  if (HAS_AUDIO_FILE) document.getElementById('audioZone').classList.remove('hidden');
  updateStats();
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('revealButtons').classList.add('hidden');
  document.getElementById('actionButtons').classList.remove('hidden');
}

function setupCardAudio(word) {
  var zone = document.getElementById('audioZone');
  var btn = document.getElementById('playBtn');
  var credit = document.getElementById('audioCredit');
  zone.classList.add('hidden');
  btn.classList.remove('playing', 'failed');
  var e = audioEntry(word);
  if (e) {
    btn.disabled = false;
    btn.textContent = '▶ Écouter';
    fillCredit(credit, e);
  } else {
    btn.disabled = true;
    btn.textContent = 'Pas d\u2019enregistrement';
    credit.textContent = 'Aucun enregistrement américain trouvé sur Wikimedia Commons pour ce mot.';
  }
}

function playCurrent() {
  if (!current || !revealed) return;
  var btn = document.getElementById('playBtn');
  if (btn.disabled) return;
  playWord(current.word, btn, document.getElementById('audioCredit'));
}

function doKnown() {
  if (!current) return;
  var w = current;
  available = available.filter(function(x) { return x !== w; });
  reviewQueue = reviewQueue.filter(function(x) { return x.w !== w; });
  known.push(w);
  saveProgress();
  showWord();
}

// Remet le mot en file : il revient après « delay » autres mots révélés.
// S'il ne reste plus de mots nouveaux avant l'échéance, pickNext() le ressort plus tôt.
function doReview(delay) {
  if (!current) return;
  var w = current;
  available = available.filter(function(x) { return x !== w; });
  reviewQueue = reviewQueue.filter(function(x) { return x.w !== w; });
  reviewQueue.push({ w: w, showAtTurn: turn + delay });
  showWord();
}

function updateStats() {
  var pct = groupWords.length > 0 ? Math.round(known.length / groupWords.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stats').innerHTML =
    '<span class="st">✓ Connus\u00A0: <strong>' + known.length + '</strong></span> · ' +
    '<span class="st">↻ À revoir\u00A0: <strong>' + reviewQueue.length + '</strong></span> · ' +
    '<span class="st">Restants\u00A0: <strong>' + available.length + '</strong></span> · ' +
    '<span class="st">Tour\u00A0: <strong>' + turn + '</strong></span>';
}

function doRestart() {
  available = groupWords.slice();
  reviewQueue = [];
  known = [];
  turn = 0;
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('theCard').style.display = '';
  document.querySelector('.buttons-zone').style.display = '';
  document.getElementById('stats').style.display = '';
  showWord();
}

// ═══════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════
function tapHandler(id, fn) {
  var el = document.getElementById(id);
  if (!el) return;
  var touched = false;
  el.addEventListener('touchstart', function(e) {
    e.preventDefault(); e.stopPropagation(); touched = true; fn();
  }, { passive: false });
  el.addEventListener('touchend', function(e) {
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });
  el.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    if (!touched) fn();
    touched = false;
  });
}

tapHandler('revealBtn', doReveal);
tapHandler('knownBtn', doKnown);
tapHandler('review3Btn', function() { doReview(3); });
tapHandler('review5Btn', function() { doReview(5); });
tapHandler('review20Btn', function() { doReview(20); });
tapHandler('restartBtn', doRestart);
tapHandler('backBtn', goBack);
tapHandler('backBtn2', goBack);
document.getElementById('playBtn').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation(); playCurrent();
});

document.addEventListener('touchmove', function(e) {
  if (document.getElementById('screenCard').classList.contains('active')) e.preventDefault();
}, { passive: false });

// Keyboard support
document.addEventListener('keydown', function(e) {
  if (document.getElementById('screenCard').classList.contains('active')) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (e.target && e.target.id === 'playBtn') return;
      e.preventDefault();
      if (!revealed) doReveal();
    } else if (e.code === 'ArrowRight' || e.code === 'KeyK') {
      if (revealed) doKnown();
    } else if (e.code === 'ArrowLeft' || e.code === 'KeyR' || e.code === 'Digit1' || e.code === 'Numpad1') {
      if (revealed) doReview(3);
    } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
      if (revealed) doReview(5);
    } else if (e.code === 'Digit3' || e.code === 'Numpad3') {
      if (revealed) doReview(20);
    } else if (e.code === 'KeyP' || e.code === 'KeyL') {
      if (revealed) playCurrent();
    } else if (e.code === 'Escape') {
      goBack();
    }
  } else if (document.getElementById('screenLesson').classList.contains('active')) {
    if (e.code === 'Escape') backToGroups();
  }
});

function buildLessonGrid() {
  var grid = document.getElementById('lessonsGrid');
  grid.innerHTML = '';
  for (var i = 0; i < L.length; i++) {
    var btn = document.createElement('div');
    btn.className = 'group-btn';
    btn.innerHTML = '<span class="gname">' + L[i][0] + '</span><span class="gcount">' + L[i][1].length + ' mots</span>';
    (function(ii) {
      btn.addEventListener('click', function() { openLesson(ii); });
      btn.addEventListener('touchstart', function(e) { e.preventDefault(); openLesson(ii); }, {passive:false});
    })(i);
    grid.appendChild(btn);
  }
}

function openLesson(i) {
  var list = document.getElementById('lessonList');
  var idx = L[i][1];
  var html = '';
  for (var k = 0; k < idx.length; k++) {
    var w = W[idx[k]];
    var ae = audioEntry(w[0]);
    html += '<div class="lrow"><span class="lw">' +
            (HAS_AUDIO_FILE ? '<button class="lplay" type="button"' + (ae ? '' : ' disabled') + '></button>' : '') +
            '<span class="lwt"></span></span><span class="li"></span><span class="lf"></span>' +
            (w[3] ? '<span class="ln"></span>' : '') +
            (HAS_AUDIO_FILE ? '<span class="lc"></span>' : '') + '</div>';
  }
  list.innerHTML = html;
  var rows = list.querySelectorAll('.lrow');
  for (k = 0; k < idx.length; k++) {
    var v = W[idx[k]];
    rows[k].querySelector('.lwt').textContent = v[0];
    if (HAS_AUDIO_FILE) {
      var ent = audioEntry(v[0]);
      var pb = rows[k].querySelector('.lplay');
      pb.textContent = '▶';
      pb.setAttribute('data-k', idx[k]);
      pb.setAttribute('aria-label', ent ? 'Écouter ' + v[0] : 'Pas d\u2019enregistrement pour ' + v[0]);
      if (ent) fillCredit(rows[k].querySelector('.lc'), ent);
      else rows[k].querySelector('.lc').textContent = 'Pas d\u2019enregistrement.';
    }
    rows[k].querySelector('.li').textContent = '[' + v[1] + ']';
    rows[k].querySelector('.lf').textContent = v[2];
    if (v[3]) rows[k].querySelector('.ln').textContent = v[3];
  }
  document.getElementById('lessonTitle').innerHTML = '';
  document.getElementById('lessonTitle').textContent = L[i][0];
  var cnt = document.createElement('span');
  cnt.textContent = idx.length + ' mots';
  document.getElementById('lessonTitle').appendChild(cnt);
  list.scrollTop = 0;
  document.getElementById('screenGroups').classList.remove('active');
  document.getElementById('screenLesson').classList.add('active');
}

function backToGroups() {
  stopAudio();
  document.getElementById('screenLesson').classList.remove('active');
  document.getElementById('screenGroups').classList.add('active');
}

function setMode(lessons) {
  document.getElementById('tabCards').classList.toggle('active', !lessons);
  document.getElementById('tabLessons').classList.toggle('active', lessons);
  if (lessons) currentParent = null; else refreshGrid();
  document.getElementById('gridHead').style.display = (!lessons && currentParent) ? 'flex' : 'none';
  document.getElementById('groupsGrid').style.display = lessons ? 'none' : '';
  document.getElementById('lessonsGrid').style.display = lessons ? '' : 'none';
  document.getElementById('subtitle').textContent = lessons
    ? 'Les mots classés par voyelle accentuée'
    : 'Prononciation API · General American';
}

tapHandler('gridBackBtn', buildGroupGrid);
tapHandler('tabCards', function() { setMode(false); });
tapHandler('tabLessons', function() { setMode(true); });
tapHandler('backBtn3', backToGroups);
document.getElementById('lessonList').addEventListener('click', function(e) {
  var b = e.target.closest ? e.target.closest('.lplay') : null;
  if (!b || b.disabled) return;
  var row = b.parentNode.parentNode;
  playWord(W[+b.getAttribute('data-k')][0], b, row.querySelector('.lc'));
});

buildGroupGrid();
buildLessonGrid();
</script>
